<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brush Stroke — Snitch</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#07080A;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let t=0,W,H;
function resize(){c.width=W=innerWidth;c.height=H=innerHeight}
resize();addEventListener('resize',resize);

function bez(p0,p1,p2,p3,t){
  const m=1-t;
  return[m*m*m*p0[0]+3*m*m*t*p1[0]+3*m*t*t*p2[0]+t*t*t*p3[0],
         m*m*m*p0[1]+3*m*m*t*p1[1]+3*m*t*t*p2[1]+t*t*t*p3[1]];
}

function frame(){
  t+=.005;
  x.fillStyle='#07080A';x.fillRect(0,0,W,H);

  const progress=.5-.5*Math.cos(t*Math.PI);
  const steps=400;
  const drawn=Math.floor(steps*progress);

  // curve through canvas — S shape
  const p0=[W*.14,H*.72],p1=[W*.38,H*.12],p2=[W*.62,H*.88],p3=[W*.86,H*.28];

  // draw each segment with varying width
  for(let i=0;i<drawn-1;i++){
    const ta=i/steps,tb=(i+1)/steps;
    const a=bez(p0,p1,p2,p3,ta);
    const b=bez(p0,p1,p2,p3,tb);

    // pressure profile: thin at ends, thick in middle
    const pressure=Math.sin(ta*Math.PI);
    // calligraphic angle adds horizontal variation
    const callig=Math.abs(Math.cos(ta*Math.PI*2))*.4;
    const baseW=Math.min(W,H)*.065;
    const w=Math.max(1,baseW*(pressure+callig*.3+.05));

    x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);
    x.lineWidth=w;x.lineCap='round';x.lineJoin='round';
    // color from orange to white tip
    const mix=ta>.9?(ta-.9)*10:0;
    const r=Math.round(255);
    const g2=Math.round(77+mix*(231-77));
    const b2=Math.round(38+mix*(225-38));
    x.strokeStyle=`rgb(${r},${g2},${b2})`;
    x.globalAlpha=.9+pressure*.1;x.stroke();
  }

  // glowing tip
  if(drawn>1){
    const tip=bez(p0,p1,p2,p3,drawn/steps);
    const glow=x.createRadialGradient(tip[0],tip[1],0,tip[0],tip[1],Math.min(W,H)*.06);
    glow.addColorStop(0,'rgba(255,200,150,.8)');
    glow.addColorStop(.4,'rgba(255,77,38,.3)');
    glow.addColorStop(1,'rgba(255,77,38,0)');
    x.globalAlpha=1;x.fillStyle=glow;
    x.beginPath();x.arc(tip[0],tip[1],Math.min(W,H)*.06,0,7);x.fill();
  }

  x.globalAlpha=1;
  label('BRUSH STROKE','VARIABLE WIDTH · PRESSURE · CALLIGRAPHIC');
  requestAnimationFrame(frame);
}

function label(name,desc){
  const p=Math.min(W,H)*.038;
  x.fillStyle='#FF4D26';x.font=`700 ${p*.38}px monospace`;x.textAlign='left';
  x.fillText(name,p,p*1.1);
  x.fillStyle='rgba(233,231,225,.38)';x.font=`${p*.26}px monospace`;
  x.fillText(desc,p,p*1.65);
}

frame();
</script>
</body>
</html>
