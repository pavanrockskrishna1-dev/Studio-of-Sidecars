<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expressions — Snitch</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#07080A;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let t=0,W,H;
function resize(){c.width=W=innerWidth;c.height=H=innerHeight}
resize();addEventListener('resize',resize);

// seeded pseudo-random for stable noise
function noise(t,seed=0){
  return Math.sin(t*2.3+seed)*Math.cos(t*1.7+seed+1.2)*Math.sin(t*.9+seed+2.4);
}
function wiggle(freq,amp,t,seed=0){
  return(noise(t*freq,seed)+noise(t*freq*2.1,seed+10)*.5)*amp*.66;
}

const EXPRS=[
  {name:'wiggle(2, 80)',col:'#FF4D26'},
  {name:'loopOut("cycle")',col:'#4DA6FF'},
  {name:'Math.sin(time*3)*60',col:'#4DFF8C'},
];

function frame(){
  t+=.015;
  x.fillStyle='rgba(7,8,10,.18)';x.fillRect(0,0,W,H);

  const r=Math.min(W,H)*.07;
  const cx=W/2,cy=H/2;

  EXPRS.forEach((expr,i)=>{
    const angle=((i/EXPRS.length)*Math.PI*2)+t*.12;
    const orbit=Math.min(W,H)*.26;
    const baseX=cx+Math.cos(angle)*orbit;
    const baseY=cy+Math.sin(angle)*orbit;

    // wiggle drives position
    const wx=wiggle(2,Math.min(W,H)*.1,t,i*10);
    const wy=wiggle(2,Math.min(W,H)*.1,t,i*10+5);
    const px=baseX+wx,py=baseY+wy;

    // trail
    for(let j=8;j>=1;j--){
      const jt=t-j*.04;
      const jwx=wiggle(2,Math.min(W,H)*.1,jt,i*10);
      const jwy=wiggle(2,Math.min(W,H)*.1,jt,i*10+5);
      const jangle=((i/EXPRS.length)*Math.PI*2)+jt*.12;
      const jx=cx+Math.cos(jangle)*orbit+jwx;
      const jy=cy+Math.sin(jangle)*orbit+jwy;
      x.globalAlpha=(.1*(1-j/8));
      x.fillStyle=expr.col;
      x.beginPath();x.arc(jx,jy,r*(1-j/12),0,7);x.fill();
    }

    // main dot
    const g=x.createRadialGradient(px,py,0,px,py,r*1.4);
    g.addColorStop(0,expr.col);g.addColorStop(1,'rgba(0,0,0,0)');
    x.globalAlpha=.9;x.fillStyle=g;x.beginPath();x.arc(px,py,r*1.4,0,7);x.fill();
    x.globalAlpha=1;x.fillStyle=expr.col;x.beginPath();x.arc(px,py,r,0,7);x.fill();

    // expression label
    const efs=Math.min(W,H)*.022;
    x.fillStyle=expr.col;x.globalAlpha=.75;
    x.font=`600 ${efs}px monospace`;x.textAlign='center';
    x.fillText(expr.name,px,py-r*1.8);
    x.globalAlpha=1;
  });

  // center crosshair
  x.globalAlpha=.1;x.strokeStyle='#FF4D26';x.lineWidth=1;
  x.beginPath();x.moveTo(cx-20,cy);x.lineTo(cx+20,cy);x.stroke();
  x.beginPath();x.moveTo(cx,cy-20);x.lineTo(cx,cy+20);x.stroke();
  x.globalAlpha=1;

  label('EXPRESSIONS','wiggle() · loopOut() · Math.sin() · time');
  requestAnimationFrame(frame);
}

function label(name,desc){
  const p=Math.min(W,H)*.038;
  x.fillStyle='#FF4D26';x.font=`700 ${p*.38}px monospace`;x.textAlign='left';
  x.fillText(name,p,p*1.1);
  x.fillStyle='rgba(233,231,225,.38)';x.font=`${p*.26}px monospace`;
  x.fillText(desc,p,p*1.65);
}

frame();
</script>
</body>
</html>
