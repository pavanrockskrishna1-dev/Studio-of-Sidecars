<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle System — Snitch</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#07080A;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;
function resize(){c.width=W=innerWidth;c.height=H=innerHeight}
resize();addEventListener('resize',resize);

const P=[];
const COLS=['#FF4D26','#FF5E3B','#FF8C6A','#FFB49A','#E9E7E1'];

function spawn(cx,cy){
  const count=Math.floor(Math.random()*3)+2;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=(.5+Math.random()*3.5)*(Math.min(W,H)/600);
    P.push({
      x:cx,y:cy,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-sp*.4,
      life:1,maxLife:1,
      r:(1.5+Math.random()*3.5)*(Math.min(W,H)/600),
      col:COLS[Math.floor(Math.random()*COLS.length)],
      rot:Math.random()*Math.PI*2,
      rotV:(Math.random()-.5)*.2
    });
  }
}

function frame(){
  x.fillStyle='rgba(7,8,10,.18)';x.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2;
  // spawn from center
  if(Math.random()<.7)spawn(cx+( Math.random()-.5)*20,cy+(Math.random()-.5)*20);

  // secondary emitters
  const now=Date.now()*.001;
  if(Math.random()<.3){
    const a=now*.8;
    const r=Math.min(W,H)*.12;
    spawn(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  }

  for(let i=P.length-1;i>=0;i--){
    const p=P[i];
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=.06*(H/600);
    p.life-=.016;p.rot+=p.rotV;
    if(p.life<=0){P.splice(i,1);continue}

    const a=p.life*.95;
    x.save();x.translate(p.x,p.y);x.rotate(p.rot);
    x.globalAlpha=a;x.fillStyle=p.col;
    // spark shape
    x.beginPath();
    x.moveTo(0,-p.r*2);x.lineTo(p.r*.4,0);
    x.lineTo(0,p.r*.8);x.lineTo(-p.r*.4,0);
    x.closePath();x.fill();
    x.restore();
  }

  // core glow
  const g=x.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.12);
  g.addColorStop(0,'rgba(255,77,38,.5)');
  g.addColorStop(.4,'rgba(255,77,38,.12)');
  g.addColorStop(1,'rgba(255,77,38,0)');
  x.globalAlpha=1;x.fillStyle=g;x.beginPath();x.arc(cx,cy,Math.min(W,H)*.12,0,7);x.fill();

  label('PARTICLE SYSTEM','EMITTER · PHYSICS · GRAVITY · SPAWN RATE');
  requestAnimationFrame(frame);
}

function label(name,desc){
  const p=Math.min(W,H)*.038;
  x.fillStyle='#FF4D26';x.font=`700 ${p*.38}px monospace`;x.textAlign='left';
  x.globalAlpha=1;x.fillText(name,p,p*1.1);
  x.fillStyle='rgba(233,231,225,.38)';x.font=`${p*.26}px monospace`;
  x.fillText(desc,p,p*1.65);
}

frame();
</script>
</body>
</html>
