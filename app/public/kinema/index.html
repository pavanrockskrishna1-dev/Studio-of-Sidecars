// ---------- MP4 export ----------
// v49: WebCodecs is the DEFAULT MP4 path whenever VideoEncoder exists.
// MediaRecorder is the fallback only when WebCodecs is unavailable.
// The WebCodecs path is frame-accurate (no real-time overshoot), muxes a
// proper MP4 with avc1+avcC+stsc+stco, and can include AAC audio.
async function startMp4Export(){
  if(exporting||xJobBusy)return;
  // WebCodecs path — frame-accurate capture (PREFERRED)
  if(typeof VideoEncoder!=='undefined'){
    startWebCodecsMp4Export();
    return;}
  // MediaRecorder fallback — real-time capture
  const mp4Mime=window.MediaRecorder&&['video/mp4;codecs=h264','video/mp4;codecs=avc1','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
  if(mp4Mime){
    startExport(mp4Mime);
    return;}
  toast('MP4 encoding not supported — need VideoEncoder or MediaRecorder with H.264');}

// ---------- WebCodecs MP4 export (v49: default path) ----------
// Frame-accurate capture. Muxes video (H.264) + audio (AAC-LC if available)
// into a single MP4 file. Falls back to WAV sidecar if AudioEncoder/AAC
// is unsupported.
async function startWebCodecsMp4Export(){
  if(exporting||xJobBusy)return;
  xJobBusy=true;playing=false;updPlayBtn();
  const ui=xJobUI();
  let encoder=null,off=null,audioEnc=null;
  let aborted=false;
  try{
    ui.set('PRELOADING…');
    await preloadProjectImages();
    const fps=project.fps,n=Math.max(1,Math.round(project.dur*fps));
    const W=project.w,H=project.h;
    const area=W*H;
    let codec;
    if(area<=414720)codec='avc1.42E01E';
    else if(area<=2073600)codec='avc1.640028';
    else codec='avc1.640033';
    off=document.createElement('canvas');off.width=W;off.height=H;
    const octx=off.getContext('2d');
    const gOn=gradeActive();

    // ---- video encoder ----
    const vChunks=[];
    let avccConfig=null;
    encoder=new VideoEncoder({
      output:(chunk,meta)=>{
        vChunks.push(chunk);
        if(!avccConfig&&meta&&meta.decoderConfig&&meta.decoderConfig.description){
          avccConfig=meta.decoderConfig.description;
        }
      },
      error:e=>{
        console.error('VideoEncoder error:',e);
        toast('MP4 encoding failed: '+e.message);
        aborted=true;
        try{encoder.close();}catch(_){}}});
    const cfg={
      codec:codec,width:W,height:H,framerate:fps,
      bitrate:14000000,latencyMode:'realtime',
      avc:{format:'avc'}};
    let supported=false;
    try{
      if(typeof VideoEncoder.isConfigSupported==='function'){
        const probe=await VideoEncoder.isConfigSupported(cfg);
        supported=!!(probe&&probe.supported);}
      else supported=true;
    }catch(e){supported=false;}
    if(!supported){
      toast('Codec '+codec+' unsupported for '+W+'×'+H);
      throw new Error('codec not supported');}
    encoder.configure(cfg);

    // ---- render + encode video frames ----
    ui.set('RENDERING FRAMES…');
    for(let f=0;f<n;f++){
      if(aborted)break;
      const ft=Math.min(project.dur,f/fps);
      await seekAllVideos(ft);
      renderProject(octx,project,ft,{grade:gOn});
      const frame=new VideoFrame(off,{timestamp:Math.round(f*1e6/fps),duration:Math.round(1e6/fps)});
      encoder.encode(frame,{keyFrame:f%30===0});
      frame.close();
      if(f%5===0||f===n-1){
        const p=((f+1)/n)*100;
        if(ui.bar)ui.bar.style.width=p+'%';
        ui.set('ENCODING FRAME '+f+' / '+n+' — '+(p|0)+'%');
        await new Promise(r=>setTimeout(r));
        if(encoder.encodeQueueSize>10){await new Promise(r=>setTimeout(r,20));}}}
    if(aborted)throw new Error('aborted');
    ui.set('FLUSHING ENCODER…');
    await encoder.flush();

    // ---- audio: render mix via OfflineAudioContext, then encode AAC ----
    let aacChunks=[];
    let audioSampleRate=44100;
    let audioChannels=2;
    let audioDuration=0;
    let hasAudio=false;
    let aacEsds=null;

    const audioLayers=project.layers.filter(l=>l.type==='audio'&&l.visible);
    if(audioLayers.length>0){
      ui.set('RENDERING AUDIO…');
      try{
        // Render the audio mix (reuse the existing renderAudioSidecar logic
        // but capture the AudioBuffer instead of encoding to WAV)
        const sampleRate=44100;
        const length=Math.max(1,Math.ceil((project.dur+0.1)*sampleRate));
        const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
        if(OAC){
          const ctx=new OAC(2,length,sampleRate);
          for(const L of audioLayers){
            const e=mediaFor(L);
            if(!e.ok||!e.el)continue;
            try{
              const src=e.el.src||e.el.currentSrc;
              if(!src)continue;
              const res=await fetch(src);
              if(!res.ok)continue;
              const buf=await res.arrayBuffer();
              const audioBuf=await ctx.decodeAudioData(buf.slice(0));
              const node=ctx.createBufferSource();
              node.buffer=audioBuf;
              const gain=ctx.createGain();
              gain.gain.value=L.mute?0:L.volume;
              node.connect(gain);gain.connect(ctx.destination);
              node.start(0);
            }catch(err){console.warn('Audio layer skipped:',L.name,err);continue;}
          }
          const rendered=await ctx.startRendering();
          audioSampleRate=rendered.sampleRate;
          audioChannels=rendered.numberOfChannels;
          audioDuration=rendered.duration;
          hasAudio=true;

          // Try AAC encoding
          if(typeof AudioEncoder!=='undefined'){
            ui.set('ENCODING AAC…');
            try{
              // Check AAC support
              const aacCodec='mp4a.40.2';
              let aacSupported=false;
              if(typeof AudioEncoder.isConfigSupported==='function'){
                const aacProbe=await AudioEncoder.isConfigSupported({
                  codec:aacCodec,
                  sampleRate:audioSampleRate,
                  numberOfChannels:audioChannels,
                  bitrate:128000,
                });
                aacSupported=!!(aacProbe&&aacProbe.supported);
              }
              if(aacSupported){
                aacChunks=[];
                let aacConfig=null;
                audioEnc=new AudioEncoder({
                  output:(chunk,meta)=>{
                    aacChunks.push(chunk);
                    if(!aacConfig&&meta&&meta.decoderConfig&&meta.decoderConfig.description){
                      aacConfig=meta.decoderConfig.description;
                    }
                  },
                  error:e=>{console.error('AudioEncoder error:',e);}
                });
                audioEnc.configure({
                  codec:aacCodec,
                  sampleRate:audioSampleRate,
                  numberOfChannels:audioChannels,
                  bitrate:128000,
                });
                // Create AudioData from the rendered buffer and encode
                const audioData=new AudioData({
                  format:'f32-planar',
                  sampleRate:audioSampleRate,
                  numberOfFrames:rendered.length,
                  numberOfChannels:audioChannels,
                  timestamp:0,
                  data:rendered.getChannelData(0).buffer,
                });
                // For multi-channel, we need to interleave or send planar
                // AudioEncoder handles planar f32 if numberOfChannels matches
                if(audioChannels===2){
                  // Create a new AudioData with both channels interleaved
                  const left=rendered.getChannelData(0);
                  const right=rendered.getChannelData(1);
                  const interleaved=new Float32Array(left.length*2);
                  for(let i=0;i<left.length;i++){
                    interleaved[i*2]=left[i];
                    interleaved[i*2+1]=right[i];
                  }
                  audioData.close();
                  const audioData2=new AudioData({
                    format:'f32',
                    sampleRate:audioSampleRate,
                    numberOfFrames:left.length,
                    numberOfChannels:2,
                    timestamp:0,
                    data:interleaved.buffer,
                  });
                  audioEnc.encode(audioData2);
                  audioData2.close();
                }else{
                  audioEnc.encode(audioData);
                  audioData.close();
                }
                await audioEnc.flush();
                aacEsds=aacConfig;  // ESDS box data from encoder
              }else{
                console.log('AAC not supported — falling back to WAV sidecar');
              }
            }catch(ae){
              console.error('AAC encoding failed:',ae);
              aacChunks=[];
            }
          }
        }
      }catch(ae){console.warn('Audio render failed:',ae);}
    }

    // ---- mux the MP4 ----
    ui.set('MUXING MP4…');
    const mp4Blob=muxMP4WithAudio(
      vChunks,W,H,fps,n,avccConfig,
      hasAudio&&aacChunks.length>0?aacChunks:null,
      aacEsds,audioSampleRate,audioChannels,
      Math.round(audioDuration*audioSampleRate)
    );
    dl(URL.createObjectURL(mp4Blob),slug(project.name)+'.mp4');
    if(hasAudio&&aacChunks.length>0){
      toast('MP4 saved — '+n+' frames + AAC audio');
    }else if(hasAudio){
      toast('MP4 saved — '+n+' frames (AAC unsupported, saving WAV sidecar)');
      // WAV sidecar fallback
      try{
        const audioBlob=await renderAudioSidecar(project.dur);
        if(audioBlob)dl(URL.createObjectURL(audioBlob),slug(project.name)+'_audio.wav');
      }catch(ae){}
    }else{
      toast('MP4 saved — '+n+' frames (no audio layers)');
    }
  }
  catch(err){console.error(err);if(!aborted)toast('MP4 export failed: '+err.message);}
  finally{
    if(encoder){try{encoder.close();}catch(_){}}
    if(audioEnc){try{audioEnc.close();}catch(_){}}
    xJobBusy=false;dirty=true;ui.done();}}

// Render the project's audio layers into a single mixed audio Blob.
// Returns null if there are no audio layers. Produces a WAV Blob via
// OfflineAudioContext (so it works without AudioEncoder support) —
// if AudioEncoder + AAC are available, we wrap the PCM into AAC for a
// smaller sidecar. The WAV path is always taken as the fallback because
// every browser can decode WAV offline.
async function renderAudioSidecar(durSec){
  const audioLayers=project.layers.filter(l=>l.type==='audio'&&l.visible);
  if(!audioLayers.length)return null;
  // Build an OfflineAudioContext at 44100 Hz stereo for the project duration.
  // Use a minimum 0.1s to avoid zero-length context errors.
  const sampleRate=44100;
  const length=Math.max(1,Math.ceil((durSec+0.1)*sampleRate));
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if(!OAC)throw new Error('OfflineAudioContext unavailable');
  const ctx=new OAC(2,length,sampleRate);
  // For each audio layer, fetch the file as an AudioBuffer, then schedule it.
  for(const L of audioLayers){
    const e=mediaFor(L);
    if(!e.ok||!e.el)continue;
    try{
      // Re-fetch the audio file as an ArrayBuffer (we can't reuse the
      // MediaElementSource from the live export path because OfflineAudioContext
      // requires a buffer source).
      const src=e.el.src||e.el.currentSrc;
      if(!src)continue;
      const res=await fetch(src);
      if(!res.ok)continue;
      const buf=await res.arrayBuffer();
      const audioBuf=await ctx.decodeAudioData(buf.slice(0));
      const node=ctx.createBufferSource();
      node.buffer=audioBuf;
      const gain=ctx.createGain();
      gain.gain.value=L.mute?0:L.volume;
      node.connect(gain);
      gain.connect(ctx.destination);
      node.start(0);  // start at the beginning of the offline render
    }catch(err){console.warn('Audio sidecar: layer '+L.name+' skipped:',err);continue;}
  }
  const rendered=await ctx.startRendering();
  // Encode the rendered AudioBuffer to a WAV Blob (16-bit PCM).
  return audioBufferToWav(rendered);
}
// Encode an AudioBuffer to a 16-bit PCM WAV Blob.
function audioBufferToWav(buf){
  const numCh=buf.numberOfChannels;
  const sr=buf.sampleRate;
  const numFrames=buf.length;
  const bytesPerSample=2;
  const blockAlign=numCh*bytesPerSample;
  const dataSize=numFrames*blockAlign;
  const buffer=new ArrayBuffer(44+dataSize);
  const view=new DataView(buffer);
  // RIFF header
  writeAscii(view,0,'RIFF');
  view.setUint32(4,36+dataSize,true);
  writeAscii(view,8,'WAVE');
  writeAscii(view,12,'fmt ');
  view.setUint32(16,16,true);          // fmt chunk size
  view.setUint16(20,1,true);           // PCM
  view.setUint16(22,numCh,true);
  view.setUint32(24,sr,true);
  view.setUint32(28,sr*blockAlign,true);
  view.setUint16(32,blockAlign,true);
  view.setUint16(34,8*bytesPerSample,true);
  writeAscii(view,36,'data');
  view.setUint32(40,dataSize,true);
  // Interleave channel data
  const channels=[];
  for(let c=0;c<numCh;c++)channels.push(buf.getChannelData(c));
  let off=44;
  for(let i=0;i<numFrames;i++){
    for(let c=0;c<numCh;c++){
      let s=Math.max(-1,Math.min(1,channels[c][i]));
      view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);
      off+=2;}}
  return new Blob([buffer],{type:'audio/wav'});
  function writeAscii(dv,off,str){for(let i=0;i<str.length;i++)dv.setUint8(off+i,str.charCodeAt(i));}
}

// ---------- correct MP4 muxer ----------
// Produces a valid MP4 file with: ftyp + mdat + moov.
// The moov contains a proper avc1 sample entry with avcC (decoder config
// captured from the first VideoEncoder output chunk), and correct stts/stsz/
// stco/stss boxes. Samples in mdat are length-prefixed (avc format, NOT
// Annex B — the encoder is configured with avc:{format:'avc'}).
//
// Box layout:
//   ftyp (isom)
//   mdat (raw length-prefixed NAL units, one per sample)
//   moov
//     mvhd (movie header)
//     trak
//       tkhd (track header — width/height in 16.16 fixed-point)
//       mdia
//         mdhd (media header — timescale = fps, duration = n frames)
//         hdlr (handler — 'vide')
//         minf
//           vmhd (video media header)
//           dinf → dref (data reference — self-contained)
//           stbl
//             stsd → avc1 → avcC (decoder config from encoder metadata)
//             stts (time-to-sample — each sample = 1 frame at 1/fps)
//             stss (sync sample table — keyframe indices)
//             stsc (sample-to-chunk — all samples in one chunk)
//             stsz (per-sample sizes)
//             stco (chunk offset table — single chunk at ftypSize+8, built directly)

function muxMP4(chunks,w,h,fps,n,avcc){
  // ---- collect per-sample data ----
  const samples=[];   // [{data:Uint8Array, size:number, isKey:boolean}]
  let totalDataSize=0;
  for(const chunk of chunks){
    const buf=new Uint8Array(chunk.byteLength);
    chunk.copyTo(buf);
    samples.push({data:buf,size:buf.length,isKey:chunk.type==='key'});
    totalDataSize+=buf.length;
  }
  if(!avcc){
    console.warn('MP4 mux: no avcC decoder config captured — file may not play.');
    // Fallback: empty avcC (players that probe the bitstream may still work).
    avcc=new Uint8Array(0);
  }
  // Ensure avcc is a Uint8Array (it may come as ArrayBuffer or Uint8Array)
  if(avcc instanceof ArrayBuffer) avcc=new Uint8Array(avcc);
  if(!(avcc instanceof Uint8Array)) avcc=new Uint8Array(avcc);

  // ---- build boxes ----
  // We build the moov first (we need its size to compute the mdat offset),
  // but the moov needs the mdat offset for stco. So we compute sizes in
  // two passes: first compute the moov size, then the mdat offset, then
  // fill in the stco offset.

  const timescale=fps;
  const duration=n;

  // ---- helper: write a box (type + payload) ----
  function makeBox(type,payload){
    const hdr=new Uint8Array(8);
    const dv=new DataView(hdr.buffer);
    dv.setUint32(0,payload.length+8,false);  // big-endian
    for(let i=0;i<4;i++)hdr[4+i]=type.charCodeAt(i);
    return concatU8([hdr,payload]);
  }
  // ---- helper: write a full box (type + version + flags + payload) ----
  function makeFullBox(type,version,flags,payload){
    const hdr=new Uint8Array(12);
    const dv=new DataView(hdr.buffer);
    dv.setUint32(0,payload.length+12,false);
    for(let i=0;i<4;i++)hdr[4+i]=type.charCodeAt(i);
    dv.setUint8(8,version);
    hdr[9]=(flags>>>16)&0xFF;
    hdr[10]=(flags>>>8)&0xFF;
    hdr[11]=flags&0xFF;
    return concatU8([hdr,payload]);
  }
  function u32(v){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,v,false);return a;}
  function u16(v){const a=new Uint8Array(2);new DataView(a.buffer).setUint16(0,v,false);return a;}

  // ---- ftyp ----
  const ftypPayload=concatU8([
    str('isom'),           // major brand
    u32(0x200),            // minor version
    str('isom'),           // compatible brands...
    str('iso2'),
    str('mp41'),
  ]);
  const ftyp=makeBox('ftyp',ftypPayload);
  const ftypSize=ftyp.length;

  // ---- mdat (we know the size: 8 header + totalDataSize) ----
  const mdatOffset=ftypSize;  // mdat starts right after ftyp
  const mdatDataOffset=mdatOffset+8;  // first byte of sample data

  // ---- build the stbl sub-boxes ----

  // stsd → avc1 → avcC
  // avc1 sample entry (ISO 14496-15 visual sample entry):
  //   6 bytes reserved (0) + 2 bytes data_ref_index (1) +
  //   2 bytes pre_defined (0) + 2 bytes reserved (0) +
  //   12 bytes pre_defined (0) +
  //   2 bytes width + 2 bytes height +
  //   4 bytes horizresolution (72dpi) + 4 bytes vertresolution (72dpi) +
  //   4 bytes reserved (0) + 2 bytes frame_count (1) +
  //   32 bytes compressorname + 2 bytes depth (24) + 2 bytes pre_defined (-1)
  //   → total 78 bytes before child boxes (avcC)
  const avc1Pre=concatU8([
    new Uint8Array(6),          // reserved
    u16(1),                      // data_ref_index
    u16(0),                      // pre_defined
    u16(0),                      // reserved
    new Uint8Array(12),          // pre_defined (12 zero bytes)
    u16(w),                      // width
    u16(h),                      // height
    u32(0x00480000),             // horizresolution (72.0 dpi in 16.16)
    u32(0x00480000),             // vertresolution
    u32(0),                      // reserved
    u16(1),                      // frame_count
    new Uint8Array(32),          // compressorname (empty)
    u16(0x0018),                 // depth (24-bit)
    u16(0xFFFF),                 // pre_defined (-1 as signed)
  ]);
  // avcC box (decoder config)
  const avccBox=makeBox('avcC',avcc);
  const avc1Payload=concatU8([avc1Pre,avccBox]);
  const avc1=makeBox('avc1',avc1Payload);
  const stsdPayload=concatU8([u32(1),avc1]);  // entry_count=1 + one avc1 entry
  const stsd=makeFullBox('stsd',0,0,stsdPayload);

  // stts (time-to-sample): one entry, n samples, each 1 frame duration
  const sttsPayload=concatU8([
    u32(1),   // entry count
    u32(n),   // sample count
    u32(1),   // sample delta (1 frame per sample)
  ]);
  const stts=makeFullBox('stts',0,0,sttsPayload);

  // stsz (sample sizes): per-sample sizes (0=default → use per-sample entries)
  const stszParts=[u32(0),u32(n)];  // default_size=0, sample_count=n
  for(const s of samples)stszParts.push(u32(s.size));
  const stsz=makeFullBox('stsz',0,0,concatU8(stszParts));

  // stss (sync samples — keyframe indices, 1-based)
  const keyFrames=[];
  for(let i=0;i<samples.length;i++)if(samples[i].isKey)keyFrames.push(i+1);
  let stss;
  if(keyFrames.length>0&&keyFrames.length<n){
    const stssParts=[u32(keyFrames.length)];
    for(const kf of keyFrames)stssParts.push(u32(kf));
    stss=makeFullBox('stss',0,0,concatU8(stssParts));
  }else{
    stss=new Uint8Array(0);  // all keyframes or no keyframes → omit stss
  }

  // stco — chunk offset table. One chunk containing all samples (contiguous
  // in mdat). The offset is known: ftypSize + 8 (mdat header) = first byte
  // of sample data. Build directly — no post-build patching needed.
  const stcoPayload=concatU8([
    u32(1),              // entry_count = 1
    u32(mdatDataOffset), // chunk_offset = absolute file offset to first sample byte
  ]);
  const stco=makeFullBox('stco',0,0,stcoPayload);

  // stsc (sample-to-chunk): one entry — all samples are in one chunk.
  // first_chunk=1, samples_per_chunk=n, sample_description_index=1.
  // This tells the player that every sample from chunk 1 onward belongs
  // to sample description 1 (the avc1 entry in stsd).
  const stscPayload=concatU8([
    u32(1),   // entry count
    u32(1),   // first_chunk
    u32(n),   // samples_per_chunk
    u32(1),   // sample_description_index
  ]);
  const stsc=makeFullBox('stsc',0,0,stscPayload);

  // Build stbl — ISO 14496-12 ordering: stsd, stts, stss, stsc, stsz, stco
  const stblChildren=[stsd,stts];
  if(stss.length>0)stblChildren.push(stss);
  stblChildren.push(stsc,stsz,stco);
  const stbl=makeBox('stbl',concatU8(stblChildren));

  // vmhd
  const vmhd=makeFullBox('vmhd',0,1,new Uint8Array(8));

  // dinf → dref → url (self-contained)
  const urlBox=makeFullBox('url ',0,1,new Uint8Array(0));  // flag=1 → self-contained
  const dref=makeFullBox('dref',0,0,concatU8([u32(1),urlBox]));  // entry_count=1
  const dinf=makeBox('dinf',dref);

  // minf
  const minf=makeBox('minf',concatU8([vmhd,dinf,stbl]));

  // mdhd (media header)
  const mdhdPayload=concatU8([
    u32(0),u32(0),         // creation_time, modification_time
    u32(timescale),        // timescale
    u32(duration),         // duration
    u32(0x55C40000),       // language (undetermined) + pre_defined
  ]);
  const mdhd=makeFullBox('mdhd',0,0,mdhdPayload);

  // hdlr
  const hdlrPayload=concatU8([
    u32(0),                // pre_defined
    str('vide'),           // handler_type
    u32(0),u32(0),u32(0),  // reserved
    str('VideoHandler\0'), // name (null-terminated)
  ]);
  const hdlr=makeFullBox('hdlr',0,0,hdlrPayload);

  // mdia
  const mdia=makeBox('mdia',concatU8([mdhd,hdlr,minf]));

  // tkhd (track header)
  // 16.16 fixed-point for width/height
  const tkhdPayload=concatU8([
    u32(0),u32(0),         // creation_time, modification_time
    u32(1),                // track_ID
    u32(0),                // reserved
    u32(duration),         // duration (in movie timescale)
    new Uint8Array(8),     // reserved
    u16(0),                // layer
    u16(0),                // alternate_group
    u16(0),                // volume (0 = video)
    u16(0),                // reserved
    // matrix (identity): 3x3 fixed-point
    u32(0x00010000),u32(0),u32(0),
    u32(0),u32(0x00010000),u32(0),
    u32(0),u32(0),u32(0x40000000),
    u32(w<<16),            // width (16.16)
    u32(h<<16),            // height (16.16)
  ]);
  const tkhd=makeFullBox('tkhd',0,3,tkhdPayload);  // flags=3 (enabled+in_movie)

  // trak
  const trak=makeBox('trak',concatU8([tkhd,mdia]));

  // mvhd (movie header)
  const mvhdPayload=concatU8([
    u32(0),u32(0),         // creation_time, modification_time
    u32(timescale),        // timescale
    u32(duration),         // duration
    u32(0x00010000),       // rate (1.0 in 16.16)
    u16(0x0100),           // volume (1.0 in 8.8)
    u16(0),                // reserved
    new Uint8Array(8),     // reserved
    // matrix (identity)
    u32(0x00010000),u32(0),u32(0),
    u32(0),u32(0x00010000),u32(0),
    u32(0),u32(0),u32(0x40000000),
    new Uint8Array(24),    // pre_defined
    u32(2),                // next_track_ID
  ]);
  const mvhd=makeFullBox('mvhd',0,0,mvhdPayload);

  // moov
  const moov=makeBox('moov',concatU8([mvhd,trak]));

  // ---- assemble final file ----
  // ftyp + mdat(header+data) + moov
  const mdatHeader=new Uint8Array(8);
  const mdv=new DataView(mdatHeader.buffer);
  mdv.setUint32(0,8+totalDataSize,false);  // box size
  writeStr(mdatHeader,4,'mdat');

  const sampleData=concatU8(samples.map(s=>s.data));

  return new Blob([ftyp,mdatHeader,sampleData,moov],{type:'video/mp4'});

  function writeStr(buf,off,str){
    for(let i=0;i<str.length&&off+i<buf.length;i++)buf[off+i]=str.charCodeAt(i);
  }
  function str(s){
    const a=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
    return a;
  }
}
function concatU8(arrs){
  let total=0;for(const a of arrs)total+=a.length;
  const r=new Uint8Array(total);let off=0;
  for(const a of arrs){r.set(a,off);off+=a.length;}
  return r;
}

// ---------- MP4 muxer with audio (v49) ----------
// Extends the video-only muxMP4 to support a second (audio) track.
// When aacChunks is null, this produces a video-only MP4 (same as muxMP4).
// When aacChunks is provided, it adds an audio trak (mp4a with esds) and
// appends audio sample data to mdat after the video samples.
//
// mdat layout: [video sample 0][video sample 1]...[video sample n-1]
//              [audio sample 0][audio sample 1]...[audio sample m-1]
// stco: two entries — one for video chunk start, one for audio chunk start.
// stsz/stts/stsc: separate tables per track.
function muxMP4WithAudio(vChunks,w,h,fps,n,avcc,aacChunks,aacEsds,audioSampleRate,audioChannels,audioSampleCount){
  // If no audio, fall back to the video-only muxer
  if(!aacChunks||aacChunks.length===0){
    return muxMP4(vChunks,w,h,fps,n,avcc);
  }

  // ---- collect video sample data ----
  const vSamples=[];
  let vTotalSize=0;
  for(const chunk of vChunks){
    const buf=new Uint8Array(chunk.byteLength);
    chunk.copyTo(buf);
    vSamples.push({data:buf,size:buf.length,isKey:chunk.type==='key'});
    vTotalSize+=buf.length;
  }
  // ---- collect audio sample data ----
  const aSamples=[];
  let aTotalSize=0;
  for(const chunk of aacChunks){
    const buf=new Uint8Array(chunk.byteLength);
    chunk.copyTo(buf);
    aSamples.push({data:buf,size:buf.length});
    aTotalSize+=buf.length;
  }

  // Normalize avcc
  if(!avcc)avcc=new Uint8Array(0);
  if(avcc instanceof ArrayBuffer)avcc=new Uint8Array(avcc);
  if(!(avcc instanceof Uint8Array))avcc=new Uint8Array(avcc);
  // Normalize esds
  let esds=aacEsds||new Uint8Array(0);
  if(esds instanceof ArrayBuffer)esds=new Uint8Array(esds);
  if(!(esds instanceof Uint8Array))esds=new Uint8Array(esds);

  const timescale=fps;
  const vDuration=n;
  const aDuration=audioSampleCount||aSamples.length;

  // ---- helpers (same as muxMP4) ----
  function makeBox(type,payload){
    const hdr=new Uint8Array(8);
    new DataView(hdr.buffer).setUint32(0,payload.length+8,false);
    for(let i=0;i<4;i++)hdr[4+i]=type.charCodeAt(i);
    return concatU8([hdr,payload]);
  }
  function makeFullBox(type,version,flags,payload){
    const hdr=new Uint8Array(12);
    const dv=new DataView(hdr.buffer);
    dv.setUint32(0,payload.length+12,false);
    for(let i=0;i<4;i++)hdr[4+i]=type.charCodeAt(i);
    dv.setUint8(8,version);
    hdr[9]=(flags>>>16)&0xFF;hdr[10]=(flags>>>8)&0xFF;hdr[11]=flags&0xFF;
    return concatU8([hdr,payload]);
  }
  function u32(v){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,v,false);return a;}
  function u16(v){const a=new Uint8Array(2);new DataView(a.buffer).setUint16(0,v,false);return a;}
  function str(s){const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}

  // ---- ftyp ----
  const ftyp=makeBox('ftyp',concatU8([str('isom'),u32(0x200),str('isom'),str('iso2'),str('mp41')]));
  const ftypSize=ftyp.length;

  // ---- mdat: video samples then audio samples ----
  const mdatDataOffset=ftypSize+8;
  const vChunkOffset=mdatDataOffset;
  const aChunkOffset=mdatDataOffset+vTotalSize;

  // ---- build video trak (same as muxMP4) ----
  const vTrak=buildVideoTrak(w,h,timescale,vDuration,vSamples,avcc,vChunkOffset);

  // ---- build audio trak ----
  const aTrak=buildAudioTrak(audioSampleRate,audioChannels,aDuration,aSamples,esds,aChunkOffset);

  // ---- mvhd ----
  const mvhd=makeFullBox('mvhd',0,0,concatU8([
    u32(0),u32(0),u32(timescale),u32(vDuration),
    u32(0x00010000),u16(0x0100),u16(0),new Uint8Array(8),
    u32(0x00010000),u32(0),u32(0),u32(0),u32(0x00010000),u32(0),u32(0),u32(0),u32(0x40000000),
    new Uint8Array(24),u32(3),  // next_track_ID = 3 (video=1, audio=2)
  ]));

  // ---- moov ----
  const moov=makeBox('moov',concatU8([mvhd,vTrak,aTrak]));

  // ---- assemble ----
  const mdatHeader=new Uint8Array(8);
  new DataView(mdatHeader.buffer).setUint32(0,8+vTotalSize+aTotalSize,false);
  for(let i=0;i<4;i++)mdatHeader[4+i]='mdat'.charCodeAt(i);
  const vData=concatU8(vSamples.map(s=>s.data));
  const aData=concatU8(aSamples.map(s=>s.data));
  return new Blob([ftyp,mdatHeader,vData,aData,moov],{type:'video/mp4'});

  // ---- video trak builder (inlined from muxMP4) ----
  function buildVideoTrak(w,h,timescale,duration,samples,avcc,chunkOffset){
    const avc1Pre=concatU8([
      new Uint8Array(6),u16(1),u16(0),u16(0),new Uint8Array(12),
      u16(w),u16(h),u32(0x00480000),u32(0x00480000),u32(0),u16(1),
      new Uint8Array(32),u16(0x0018),u16(0xFFFF),
    ]);
    const avccBox=makeBox('avcC',avcc);
    const avc1=makeBox('avc1',concatU8([avc1Pre,avccBox]));
    const stsd=makeFullBox('stsd',0,0,concatU8([u32(1),avc1]));
    const stts=makeFullBox('stts',0,0,concatU8([u32(1),u32(samples.length),u32(1)]));
    const stszParts=[u32(0),u32(samples.length)];
    for(const s of samples)stszParts.push(u32(s.size));
    const stsz=makeFullBox('stsz',0,0,concatU8(stszParts));
    const keyFrames=[];
    for(let i=0;i<samples.length;i++)if(samples[i].isKey)keyFrames.push(i+1);
    const stblChildren=[stsd,stts];
    if(keyFrames.length>0&&keyFrames.length<samples.length){
      const stssParts=[u32(keyFrames.length)];
      for(const kf of keyFrames)stssParts.push(u32(kf));
      stblChildren.push(makeFullBox('stss',0,0,concatU8(stssParts)));
    }
    stblChildren.push(
      makeFullBox('stsc',0,0,concatU8([u32(1),u32(1),u32(samples.length),u32(1)])),
      stsz,
      makeFullBox('stco',0,0,concatU8([u32(1),u32(chunkOffset)]))
    );
    const stbl=makeBox('stbl',concatU8(stblChildren));
    const vmhd=makeFullBox('vmhd',0,1,new Uint8Array(8));
    const urlBox=makeFullBox('url ',0,1,new Uint8Array(0));
    const dref=makeFullBox('dref',0,0,concatU8([u32(1),urlBox]));
    const dinf=makeBox('dinf',dref);
    const minf=makeBox('minf',concatU8([vmhd,dinf,stbl]));
    const mdhd=makeFullBox('mdhd',0,0,concatU8([u32(0),u32(0),u32(timescale),u32(duration),u32(0x55C40000)]));
    const hdlr=makeFullBox('hdlr',0,0,concatU8([u32(0),str('vide'),u32(0),u32(0),u32(0),str('VideoHandler\0')]));
    const mdia=makeBox('mdia',concatU8([mdhd,hdlr,minf]));
    const tkhd=makeFullBox('tkhd',0,3,concatU8([
      u32(0),u32(0),u32(1),u32(0),u32(duration),new Uint8Array(8),
      u16(0),u16(0),u16(0),u16(0),
      u32(0x00010000),u32(0),u32(0),u32(0),u32(0x00010000),u32(0),u32(0),u32(0),u32(0x40000000),
      u32(w<<16),u32(h<<16),
    ]));
    return makeBox('trak',concatU8([tkhd,mdia]));
  }

  // ---- audio trak builder ----
  function buildAudioTrak(sampleRate,channels,duration,samples,esdsData,chunkOffset){
    // mp4a sample entry (audio sample entry):
    //   6 bytes reserved + 2 bytes data_ref_index +
    //   4 bytes reserved + 2 bytes channelcount +
    //   2 bytes samplesize + 2 bytes pre_defined + 2 bytes reserved +
    //   4 bytes samplerate (fixed-point 16.16) → 20 bytes before esds
    const mp4aPre=concatU8([
      new Uint8Array(6),      // reserved
      u16(1),                  // data_ref_index
      u32(0),                  // reserved (4 bytes, upper 2 = version, lower 2 = revision)
      u16(channels),           // channelcount
      u16(16),                 // samplesize (bits per sample)
      u16(0),                  // pre_defined
      u16(0),                  // reserved
      u32(sampleRate<<16),     // samplerate (fixed-point 16.16)
    ]);
    // esds box (ES descriptor with AAC-LC decoder config)
    const esdsBox=makeBox('esds',esdsData.length>0?esdsData:buildDefaultEsds(sampleRate,channels));
    const mp4a=makeBox('mp4a',concatU8([mp4aPre,esdsBox]));
    const stsd=makeFullBox('stsd',0,0,concatU8([u32(1),mp4a]));
    // stts: each AAC chunk = 1 sample, delta = 1024 (AAC frame size)
    const aacFrameSamples=1024;
    const numSamples=samples.length;
    const stts=makeFullBox('stts',0,0,concatU8([u32(1),u32(numSamples),u32(aacFrameSamples)]));
    const stszParts=[u32(0),u32(numSamples)];
    for(const s of samples)stszParts.push(u32(s.size));
    const stsz=makeFullBox('stsz',0,0,concatU8(stszParts));
    const stsc=makeFullBox('stsc',0,0,concatU8([u32(1),u32(1),u32(numSamples),u32(1)]));
    const stco=makeFullBox('stco',0,0,concatU8([u32(1),u32(chunkOffset)]));
    const stbl=makeBox('stbl',concatU8([stsd,stts,stsc,stsz,stco]));
    // smhd (sound media header) instead of vmhd
    const smhd=makeFullBox('smhd',0,0,new Uint8Array(8));
    const urlBox=makeFullBox('url ',0,1,new Uint8Array(0));
    const dref=makeFullBox('dref',0,0,concatU8([u32(1),urlBox]));
    const dinf=makeBox('dinf',dref);
    const minf=makeBox('minf',concatU8([smhd,dinf,stbl]));
    const mdhd=makeFullBox('mdhd',0,0,concatU8([
      u32(0),u32(0),u32(sampleRate),u32(duration),u32(0x55C40000),
    ]));
    const hdlr=makeFullBox('hdlr',0,0,concatU8([
      u32(0),str('soun'),u32(0),u32(0),u32(0),str('SoundHandler\0'),
    ]));
    const mdia=makeBox('mdia',concatU8([mdhd,hdlr,minf]));
    const tkhd=makeFullBox('tkhd',0,3,concatU8([
      u32(0),u32(0),u32(2),u32(0),u32(duration),new Uint8Array(8),
      u16(0),u16(0),u16(0x0100),u16(0),  // volume = 1.0
      u32(0x00010000),u32(0),u32(0),u32(0),u32(0x00010000),u32(0),u32(0),u32(0),u32(0x40000000),
      u32(0),u32(0),  // width=0, height=0 for audio
    ]));
    return makeBox('trak',concatU8([tkhd,mdia]));
  }

  // Build a minimal ESDS (Elementary Stream Descriptor) for AAC-LC when the
  // encoder didn't provide one. This is a fallback — the AudioEncoder's
  // decoderConfig.description is preferred.
  function buildDefaultEsds(sampleRate,channels){
    // AAC-LC AudioSpecificConfig: 2 bytes
    //   audioObjectType = 2 (AAC-LC) → 5 bits = 00010
    //   samplingFrequencyIndex → 4 bits (e.g. 4 = 44100)
    //   channelConfiguration → 4 bits
    //   framing → 3 bits (0 for not ADTS)
    const freqMap={8000:0,11025:1,12000:2,16000:3,22050:4,24000:5,32000:6,44100:7,48000:8,64000:9,88200:10,96000:11};
    const freqIdx=freqMap[sampleRate]||7;  // default 44100
    const asc0=(2<<3)|(freqIdx>>1);
    const asc1=((freqIdx&1)<<7)|(channels<<3);
    const asc=new Uint8Array([asc0,asc1]);
    // ESDS box payload: ES_Descriptor
    // Minimal structure: ES_Descriptor(tag=3) → DecoderConfigDescriptor(tag=4) → DecoderSpecificInfo(tag=5) → ASC
    const dsi=concatU8([new Uint8Array([0x05,asc.length]),asc]);  // tag=5, length, ASC
    const dcd=concatU8([
      new Uint8Array([0x04,17+dsi.length]), // tag=4, length
      new Uint8Array([0x40,0x15]), // objectTypeIndication=0x40 (Audio ISO/IEC 14496-3), streamType=0x15 (audio)
      u32(0),  // bufferSizeDB, maxBitrate, avgBitrate (simplified)
      dsi,
    ]);
    const esd=concatU8([
      new Uint8Array([0x03,3+dcd.length]), // tag=3, length
      new Uint8Array([0x00,0x00,0x00]),    // ES_ID=0, streamDependenceFlag=0
      dcd,
    ]);
    return esd;
  }
}

// ---------- Lottie / Bodymovin export ----------
// Exports a Lottie JSON covering transform keyframes (x/y/scale/rotation/
// opacity), rect/ellipse/path shapes, solid fill and stroke, and trim path.
// Layers it can't represent are skipped and listed in a warning dialog.
// Easings are mapped to bezier handles using the PRESET_REP table.
function exportLottie(){
  if(exporting||xJobBusy)return;
  xJobBusy=true;
  const ui=xJobUI();
  try{
    ui.set('BUILDING LOTTIE JSON…');
    const skipped=[];
    const layers=[];
    // Lottie layers are top-to-bottom (reverse of our bottom-to-top)
    for(let i=project.layers.length-1;i>=0;i--){
      const L=project.layers[i];
      if(!L.visible)continue;
      if(L.type==='camera'||L.type==='null'||L.type==='light'||L.type==='audio'||
         L.type==='video'||L.type==='precomp'){
        skipped.push(L.name+' ('+L.type+')');continue;}
      if(L.type==='text'){
        skipped.push(L.name+' (text — not supported in Lottie export)');continue;}
      if(L.type==='image'){
        skipped.push(L.name+' (image — not supported in Lottie export)');continue;}
      if(L.type==='particle'){
        skipped.push(L.name+' (particles — not supported in Lottie export)');continue;}
      if(L.type==='cube'){
        skipped.push(L.name+' (3D cube — not supported in Lottie export)');continue;}
      if(L.fx&&L.fx.some(f=>f.enabled)){
        // effects are not exported, but the layer itself can be
      }
      // build the Lottie layer — pass layers.length as the ind (Lottie layer index)
      // so buildLottieLayer doesn't need to reach into the enclosing scope.
      const lottieLayer=buildLottieLayer(L,project.fps,layers.length);
      if(lottieLayer)layers.push(lottieLayer);
      else skipped.push(L.name+' (unsupported shape)');}
    const lottie={
      v:'5.7.4',fr:project.fps,ip:0,op:Math.round(project.dur*project.fps),
      w:project.w,h:project.h,nm:project.name,ddd:0,assets:[],layers:layers};
    const json=JSON.stringify(lottie,null,2);
    dl(URL.createObjectURL(new Blob([json],{type:'application/json'})),
      slug(project.name)+'.lottie.json');
    toast('Lottie exported — '+layers.length+' layers');
    if(skipped.length){
      setTimeout(()=>{
        openModal('<div class="mhead"><h2>LOTTIE EXPORT — SKIPPED LAYERS</h2><button class="ibtn mclose">'+ic('x',16)+'</button></div>'
          +'<div style="padding:8px 4px;max-height:300px;overflow-y:auto">'
          +'<p style="color:var(--tx2);font-size:12px;margin-bottom:12px">'+skipped.length+' layer'+(skipped.length>1?'s were':' was')+' skipped because Lottie does not support them:</p>'
          +skipped.map(s=>'<div style="padding:4px 0;border-bottom:1px solid var(--line);font:500 11px var(--mono);color:var(--tx2)">• '+esc(s)+'</div>').join('')
          +'</div>');
        $('#modalCard .mclose').onclick=closeModal;
      },500);}
  }
  catch(err){console.error(err);toast('Lottie export failed');}
  finally{xJobBusy=false;ui.done();}}
// build a single Lottie layer from a KINEMA layer
// ind = the Lottie layer index (passed in from exportLottie as layers.length).
// Previously this referenced `layers` from the enclosing closure, but
// buildLottieLayer is a top-level function — `layers` was undefined and
// `ind` silently became 0 for every layer (or threw in strict mode).
function buildLottieLayer(L,fps,ind){
  const op=Math.round(project.dur*fps);
  // transform — map keyframes to Lottie's animated value format
  function buildAnimated(prop,key,extra){
    if(!prop||!prop.keys||!prop.keys.length){
      return{k:prop?prop.base:0};}
    // check if all keys have the same value (static)
    const allSame=prop.keys.every(k=>Math.abs(k.v-prop.keys[0].v)<1e-6);
    if(allSame)return{k:prop.keys[0].v};
    // animated — build keyframe array
    const ks=prop.keys.map((kk,i)=>{
      const ease=easingToBezier(kk.e);
      return{
        t:Math.round(kk.t*fps),
        s:[kk.v],
        i:{x:[ease[0]],y:[ease[1]]},
        o:{x:[ease[2]],y:[ease[3]]}};});
    return{k:ks,a:1};}
  function buildTransform(L){
    const px=buildAnimated(L.props.x,'x');
    const py=buildAnimated(L.props.y,'y');
    const ps=buildAnimated(L.props.scale,'scale');
    const pr=buildAnimated(L.props.rz,'rz');
    const po=buildAnimated(L.props.opacity,'opacity');
    // Lottie uses [x,y] for position, single value for scale (percentage)
    let posK, scaK, rotK, opaK;
    if(px.a||py.a){
      // animated position — combine x and y
      const xKeys=px.a?px.k:[{t:0,s:[px.k]}];
      const yKeys=py.a?py.k:[{t:0,s:[py.k]}];
      const times=new Set();
      for(const k of xKeys)times.add(k.t);
      for(const k of yKeys)times.add(k.t);
      const sorted=[...times].sort((a,b)=>a-b);
      const ks=sorted.map(t=>{
        const xv=sampleAt(px,t),yv=sampleAt(py,t);
        const ease=easingAt(px,t);
        return{t,s:[xv,yv],i:{x:[ease[0]],y:[ease[1]]},o:{x:[ease[2]],y:[ease[3]]}};});
      posK={k:ks,a:1};}
    else posK={k:[px.k,py.k]};
    // scale — Lottie uses percentage (100 = 1x)
    if(ps.a){const ks=ps.k.map(kk=>{
      const ease=easingToBezier(kk.e);
      return{t:kk.t,s:[kk.v*100],i:{x:[ease[0]],y:[ease[1]]},o:{x:[ease[2]],y:[ease[3]]}};});
      scaK={k:ks,a:1};}
    else scaK={k:ps.k*100};
    // rotation — Lottie uses degrees
    rotK=pr.a?{k:pr.k.map(kk=>{
      const ease=easingToBezier(kk.e);
      return{t:kk.t,s:[kk.v],i:{x:[ease[0]],y:[ease[1]]},o:{x:[ease[2]],y:[ease[3]]}};}),a:1}
      :{k:pr.k};
    // opacity — Lottie uses 0-100
    opaK=po.a?{k:po.k.map(kk=>{
      const ease=easingToBezier(kk.e);
      return{t:kk.t,s:[kk.v*100],i:{x:[ease[0]],y:[ease[1]]},o:{x:[ease[2]],y:[ease[3]]}};}),a:1}
      :{k:po.k*100};
    return{p:posK,a:posK,s:scaK,r:rotK,o:opaK};
    function sampleAt(anim,t){
      if(!anim.a)return anim.k;
      const ks=anim.k;
      if(t<=ks[0].t)return ks[0].s[0];
      if(t>=ks[ks.length-1].t)return ks[ks.length-1].s[0];
      for(let i=0;i<ks.length-1;i++)if(t>=ks[i].t&&t<=ks[i+1].t)return ks[i].s[0];
      return ks[0].s[0];}
    function easingAt(anim,t){
      if(!anim.a)return[0.25,0.25,0.75,0.75];
      const ks=anim.k;
      for(let i=0;i<ks.length-1;i++)if(t>=ks[i].t&&t<=ks[i+1].t)return[ks[i].i.x[0],ks[i].i.y[0],ks[i].o.x[0],ks[i].o.y[0]];
      return[0.25,0.25,0.75,0.75];}}
  // map KINEMA easing to Lottie bezier handles
  function easingToBezier(e){
    if(!e)return[0.25,0.25,0.75,0.75];
    if(typeof e==='object'&&Array.isArray(e.bezier))return e.bezier;
    if(typeof e==='string'){
      const rep=PRESET_REP[e]||PRESET_REP.easeInOut;
      // Lottie uses o (out) = first handle, i (in) = second handle
      // CSS bezier [x1,y1,x2,y2] → Lottie o=[x1,y1] i=[x2,y2]
      // but Lottie's i and o are reversed from CSS: o is the outgoing handle
      // from the current key, i is the incoming handle to the next key.
      // For simplicity, we use the same handles for both.
      return[rep[2],rep[3],rep[0],rep[1]];}  // [i.x, i.y, o.x, o.y]
    return[0.25,0.25,0.75,0.75];}
  // build shape items
  const shapes=[];
  if(L.type==='shape'){
    // build the shape path
    const pts=outlinePts(L);
    if(!pts||!pts.length)return null;
    // convert to Lottie vertices (relative to layer centre)
    const verts=pts.map(p=>{return{v:L.type==='shape'?[p[0],p[1]]:[p[0],p[1]]};});
    // shape group
    const group={ty:'gr',nm:'Shape',it:[]};
    // path
    group.it.push({ty:'sh',nm:'Path',ks:{k:{v:verts,c:L.shape==='ellipse'||(L.shape!=='polygon'&&L.shape!=='star')?1:0}}});
    // fill
    if(L.fill!=='none'){
      group.it.push({ty:'fl',nm:'Fill',c:hexToLottieColor(L.fill),o:100,r:1});}
    // stroke
    if(L.strokeW>0){
      group.it.push({ty:'st',nm:'Stroke',c:hexToLottieColor(L.strokeColor),o:100,w:L.strokeW,lc:2,lj:2});}
    // trim path (if keyframed)
    if(L.props.trimEnd&&L.props.trimEnd.keys&&L.props.trimEnd.keys.length){
      const sK=L.props.trimStart&&L.props.trimStart.keys?L.props.trimStart.keys.map(kk=>{
        const ease=easingToBezier(kk.e);
        return{t:Math.round(kk.t*fps),s:[kk.v*100],i:{x:[ease[0]],y:[ease[1]]},o:{x:[ease[2]],y:[ease[3]]}};}):null;
      const eK=L.props.trimEnd.keys.map(kk=>{
        const ease=easingToBezier(kk.e);
        return{t:Math.round(kk.t*fps),s:[kk.v*100],i:{x:[ease[0]],y:[ease[1]]},o:{x:[ease[2]],y:[ease[3]]}};});
      group.it.push({ty:'tm',nm:'Trim',
        s:sK?{k:sK,a:1}:{k:0},
        e:{k:eK,a:1},
        o:{k:0},m:1});}
    group.it.push({ty:'tr',
      p:{k:[0,0]},a:{k:[0,0]},s:{k:[100,100]},r:{k:0},o:{k:100}});
    shapes.push(group);}
  else if(L.type==='path'){
    // path layer — convert L.d segments to Lottie vertices
    const verts=[];
    let cur=null;
    for(const s of L.d){
      if(!s||!Array.isArray(s.pts))continue;
      if(s.type==='M'&&s.pts[0]){cur=[s.pts[0][0],s.pts[0][1]];verts.push({v:cur});}
      else if(s.type==='L'&&s.pts[0]){cur=[s.pts[0][0],s.pts[0][1]];verts.push({v:cur});}
      else if(s.type==='C'&&s.pts[2]){
        // approximate cubic with line segments (Lottie supports bezier curves
        // via vertex i/o handles, but for simplicity we flatten)
        // Sample 4 points per cubic
        const p0=verts.length?verts[verts.length-1].v:[0,0];
        const c1=s.pts[0],c2=s.pts[1],e=s.pts[2];
        for(let j=1;j<=4;j++){const u=j/4,v=1-u;
          const x=v*v*v*p0[0]+3*v*v*u*c1[0]+3*v*u*u*c2[0]+u*u*u*e[0];
          const y=v*v*v*p0[1]+3*v*v*u*c1[1]+3*v*u*u*c2[1]+u*u*u*e[1];
          verts.push({v:[x,y]});}}
      else if(s.type==='Z'){/* close */}}
    if(!verts.length)return null;
    const group={ty:'gr',nm:'Path',it:[]};
    group.it.push({ty:'sh',nm:'Path',ks:{k:{v:verts,c:L.closed?1:0}}});
    if(L.fill!=='none'){
      group.it.push({ty:'fl',nm:'Fill',c:hexToLottieColor(L.fill),o:100,r:1});}
    if(L.strokeW>0){
      group.it.push({ty:'st',nm:'Stroke',c:hexToLottieColor(L.strokeColor),o:100,w:L.strokeW,lc:2,lj:2});}
    // trim path
    if(L.props.trimEnd&&L.props.trimEnd.keys&&L.props.trimEnd.keys.length){
      const eK=L.props.trimEnd.keys.map(kk=>{
        const ease=easingToBezier(kk.e);
        return{t:Math.round(kk.t*fps),s:[kk.v*100],i:{x:[ease[0]],y:[ease[1]]},o:{x:[ease[2]],y:[ease[3]]}};});
      group.it.push({ty:'tm',nm:'Trim',s:{k:0},e:{k:eK,a:1},o:{k:0},m:1});}
    group.it.push({ty:'tr',p:{k:[0,0]},a:{k:[0,0]},s:{k:[100,100]},r:{k:0},o:{k:100}});
    shapes.push(group);}
  if(!shapes.length)return null;
  return{
    ddd:0,ind:ind||0,ty:4,  // 4 = shape layer
    nm:L.name,sr:1,
    ks:buildTransform(L),
    ao:0,shapes:shapes,ip:0,op:op,st:0,bm:0};}
function hexToLottieColor(hex){
  const c=hex2(hex);return[c[0]/255,c[1]/255,c[2]/255,1];}

// ---------- frame-sequence ZIP + animated GIF export ----------
const GIF_JS_CDN='https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js';
const GIF_WORKER_CDN='https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
let xJobBusy=false,gifLibP=null,gifWorkerP=null;
function loadScript(src){return new Promise((res,rej)=>{
  const s=document.createElement('script');s.src=src;
  s.onload=()=>res();s.onerror=()=>rej(new Error('Failed to load '+src));
  document.head.appendChild(s);});}
function gifLib(){return gifLibP||(gifLibP=loadScript(GIF_JS_CDN));}
function gifWorkerURL(){ // workers can't be constructed cross-origin — wrap the
  return gifWorkerP||(gifWorkerP=fetch(GIF_WORKER_CDN).then(r=>{ // fetched code in a blob URL
    if(!r.ok)throw new Error('gif.worker.js HTTP '+r.status);return r.text();})
  .then(txt=>URL.createObjectURL(new Blob([txt],{type:'application/javascript'})))
  .catch(()=>GIF_WORKER_CDN));}

function xJobUI(){ // shared progress widgets (also used by the WebM recorder)
  const pw=$('#xProgWrap'),bar=$('#xProg'),st=$('#xState');
  if(pw){pw.style.display='block';$('#xProg').style.width='0%';}

// -- CRC32 (table-driven, IEEE 0xEDB88320) for the ZIP entries --
const CRC32_T=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}
  return t;})();
function crc32(u8){let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)c=CRC32_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;}

// -- minimal STORE-only ZIP builder: local file headers + central directory,
//    no deflate (PNG payloads are already compressed) --
function makeZip(files){ // files:[{name,data:Uint8Array,crc}] -> Blob
  const enc=new TextEncoder(),parts=[],central=[];
  const d=new Date();
  const dT=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dD=((((d.getFullYear()-1980)&0x7F)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  let off=0;
  for(const f of files){
    const nb=enc.encode(f.name);
    const lh=new Uint8Array(30+nb.length),lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034B50,true);lv.setUint16(4,20,true);   // sig + version
    lv.setUint16(10,dT,true);lv.setUint16(12,dD,true);         // mod time/date
    lv.setUint32(14,f.crc,true);                               // CRC32
    lv.setUint32(18,f.data.length,true);lv.setUint32(22,f.data.length,true); // stored: comp == uncomp
    lv.setUint16(26,nb.length,true);                           // name length (extra = 0)
    lh.set(nb,30);
    parts.push(lh,f.data);
    const ch=new Uint8Array(46+nb.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014B50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(12,dT,true);cv.setUint16(14,dD,true);
    cv.setUint32(16,f.crc,true);
    cv.setUint32(20,f.data.length,true);cv.setUint32(24,f.data.length,true);
    cv.setUint16(28,nb.length,true);
    cv.setUint32(42,off,true);                                 // offset of local header
    ch.set(nb,46);
    central.push(ch);
    off+=lh.length+f.data.length;}
  let cdSize=0;for(const c of central)cdSize+=c.length;
  const eo=new Uint8Array(22),ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054B50,true);
  ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);      // cd size / cd offset
  return new Blob([...parts,...central,eo],{type:'application/zip'});}

async function exportPngZip(){
  if(exporting||xJobBusy)return;
  xJobBusy=true;playing=false;updPlayBtn();
  const ui=xJobUI();
  try{
    ui.set('PRELOADING IMAGES…');
    await preloadProjectImages();
    const fps=project.fps,n=Math.max(1,Math.round(project.dur*fps));
    const off=document.createElement('canvas');off.width=project.w;off.height=project.h;
    const octx=off.getContext('2d');
    const mbOn=project.motionBlur&&project.layers.some(l=>l.motionBlur!==false&&l.visible&&l.type!=='camera'&&l.type!=='null');
    const gOn=gradeActive();
    const files=[];
    for(let f=0;f<=n;f++){ // sweep t = 0 … dur in 1/fps steps (both ends included)
      const ft=Math.min(project.dur,f/fps);
      // seek video layers to the correct frame before rendering
      await seekAllVideos(ft);
      if(mbOn)renderMotionBlur(octx,project,ft,{grade:gOn});
      else renderProject(octx,project,ft,{grade:gOn});
      const b=await new Promise(r=>off.toBlob(r,'image/png'));
      const data=new Uint8Array(await b.arrayBuffer());
      files.push({name:'frame_'+String(f).padStart(5,'0')+'.png',data,crc:crc32(data)});
      if(f%10===0||f===n){ // progress refresh every 10 frames
        const p=((f+1)/(n+1))*100;
        if(ui.bar)ui.bar.style.width=p+'%';
        ui.set('RENDERING FRAME '+f+' / '+n+' — '+(p|0)+'%');
        await new Promise(r=>setTimeout(r));}} // yield so the modal can paint
    ui.set('PACKING ZIP…');
    if(ui.bar)ui.bar.style.width='100%';
    dl(URL.createObjectURL(makeZip(files)),slug(project.name)+'.frames.zip');
    toast('PNG sequence saved — '+files.length+' frames');}
  catch(err){console.error(err);toast('PNG sequence export failed');}
  finally{xJobBusy=false;dirty=true;ui.done();}}

async function exportGif(){
  if(exporting||xJobBusy)return;
  xJobBusy=true;playing=false;updPlayBtn();
  const ui=xJobUI();
  let gif=null;
  try{
    ui.set('LOADING GIF ENCODER…');
    await gifLib();
    const wurl=await gifWorkerURL();
    await preloadProjectImages();
    const fps=Math.min(30,project.fps);        // cap 30fps
    const k=Math.min(1,800/project.w);         // cap 800px wide
    const W=Math.max(2,Math.round(project.w*k)),H=Math.max(2,Math.round(project.h*k));
    gif=new GIF({workers:2,quality:10,width:W,height:H,workerScript:wurl});
    gif.on('progress',p=>{
      if(ui.bar)ui.bar.style.width=(60+p*40)+'%';
      ui.set('ENCODING GIF — '+Math.round(p*100)+'%');});
    gif.on('finished',blob=>{
      dl(URL.createObjectURL(blob),slug(project.name)+'.gif');
      toast('GIF saved — '+W+'×'+H+' @ '+fps+'fps');
      xJobBusy=false;dirty=true;ui.done();});
    const full=document.createElement('canvas');full.width=project.w;full.height=project.h;
    const fctx=full.getContext('2d');
    const sm=document.createElement('canvas');sm.width=W;sm.height=H;
    const sctx=sm.getContext('2d');
    sctx.imageSmoothingEnabled=true;sctx.imageSmoothingQuality='high';
    const n=Math.max(1,Math.round(project.dur*fps));
    const mbOn=project.motionBlur&&project.layers.some(l=>l.motionBlur!==false&&l.visible&&l.type!=='camera'&&l.type!=='null');
    const gOn=gradeActive();
    ui.set('RENDERING FRAMES…');
    for(let f=0;f<n;f++){ // f = 0…n-1: at t=dur the loop wraps to t=0, so the
      const ft=f/fps;                       // final frame would duplicate frame 0
      // seek video layers to the correct frame before rendering
      await seekAllVideos(ft);
      if(mbOn)renderMotionBlur(fctx,project,ft,{grade:gOn});
      else renderProject(fctx,project,ft,{grade:gOn});
      sctx.drawImage(full,0,0,W,H);
      gif.addFrame(sm,{delay:Math.round(1000/fps),copy:true});
      if(f%10===0){
        if(ui.bar)ui.bar.style.width=((f/n)*60)+'%';
        ui.set('RENDERING FRAME '+f+' / '+n+' — '+(((f/n)*60)|0)+'%');
        await new Promise(r=>setTimeout(r));}}
    ui.set('ENCODING GIF…');}
  catch(err){console.error(err);toast('GIF export failed');xJobBusy=false;ui.done();return;}
  // encoder runs on workers — busy flag + progress UI clear in 'finished'
  gif.render();}

// ===========================================================================
// FEATURE BLOCK (v39 additions): graph editor, onion skin, open-project
// validation, performance (previewQ + live FPS), layer-timing helpers.
// All new code; existing functions are extended separately above (sanitize,
// mkText, rasterFor, fontStr). The boot section wires up the UI below.
// ===========================================================================

// ---------- graph editor (value + speed curves) ----------
// A timeline tab that plots the selected property's value curve and its
// time-derivative (speed). Keys are draggable; bezier handles are draggable
// and write {bezier:[x1,y1,x2,y2]} in the same format as the small curve
// editor (easeCurveUI). Two-way sync: changes here update selKey.kk.e, which
// the small editor reads via curBez().
//
// State: graphOpen (bool), graphView ({tMin,tMax,vMin,vMax}), graphMode
// ('value'|'speed'), graphSelProp (the property key being edited).
let graphOpen=false;
let graphView=null;          // {tMin,tMax,vMin,vMax} in user units (seconds, value)
let graphMode='value';       // 'value' | 'speed'
let graphSelProp=null;        // property key string ('x','y','rz',…)
let graphDragKind=null;       // 'key'|'handleIn'|'handleOut'|'pan'|null
let graphDragKey=null;         // the keyframe object being dragged
let graphDragMoved=false;
const GRAPH_PRESETS=[
  {label:'EASE IN-OUT',e:'easeInOut'},
  {label:'EASE IN',e:'easeIn'},
  {label:'EASE OUT',e:'easeOut'},
  {label:'LINEAR',e:'linear'},
  {label:'BACK OUT',e:'backOut'},
  {label:'HOLD',e:'hold'}
];
function graphCurrentProp(){
  // Resolve the property to display: explicit graphSelProp, else selKey.k,
  // else the first keyed property on sel.
  if(graphSelProp)return graphSelProp;
  if(selKey&&selKey.k)return selKey.k;
  if(sel&&sel.props){
    for(const k of PROP_KEYS)if(sel.props[k]&&sel.props[k].keys&&sel.props[k].keys.length)return k;
  }
  return null;
}
function graphPropObj(){
  const k=graphCurrentProp();if(!k||!sel)return null;
  if(k==='timeRemap')return{keys:sel.timeRemapKeys||[]};
  return sel.props[k];
}
// Convert (t, v) user units ↔ canvas pixels. Auto-fit when graphView is null.
function graphFit(){
  const p=graphPropObj();if(!p||!p.keys||!p.keys.length){graphView=null;return;}
  let tMin=Infinity,tMax=-Infinity,vMin=Infinity,vMax=-Infinity;
  for(const kk of p.keys){tMin=Math.min(tMin,kk.t);tMax=Math.max(tMax,kk.t);
    vMin=Math.min(vMin,kk.v);vMax=Math.max(vMax,kk.v);}
  if(tMax-tMin<1e-3){tMin-=0.5;tMax+=0.5;}
  if(vMax-vMin<1e-3){vMin-=1;vMax+=1;}
  // padding
  const tPad=(tMax-tMin)*0.1,vPad=(vMax-vMin)*0.2;
  graphView={tMin:tMin-tPad,tMax:tMax+tPad,vMin:vMin-vPad,vMax:vMax+vPad};
}
function graphDraw(){
  const cv=$('#graphCanvas');if(!cv)return;
  const dpr=devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=cssVar('--bg0');c.fillRect(0,0,W,H);
  if(!sel){c.fillStyle=cssVar('--tx3');c.font='500 11px '+cssVar('--mono');
    c.textAlign='center';c.fillText('Select a layer to edit its graph',W/2,H/2);return;}
  const p=graphPropObj();
  if(!p||!p.keys||!p.keys.length){
    c.fillStyle=cssVar('--tx3');c.font='500 11px '+cssVar('--mono');
    c.textAlign='center';c.fillText('No keyframes on '+(graphCurrentProp()||'this property'),W/2,H/2);return;}
  if(!graphView)graphFit();
  const v=graphView;
  const tX=t=>(t-v.tMin)/(v.tMax-v.tMin)*W;
  const pY=val=>H-(val-v.vMin)/(v.vMax-v.vMin)*H;
  // grid
  c.strokeStyle=cssVar('--line');c.lineWidth=1;
  for(let i=1;i<5;i++){const x=W*i/5;c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();
    const y=H*i/5;c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  // zero value line (if visible)
  if(v.vMin<0&&v.vMax>0){c.strokeStyle='#3A4150';c.setLineDash([3,3]);
    c.beginPath();c.moveTo(0,pY(0));c.lineTo(W,pY(0));c.stroke();c.setLineDash([]);}
  // sample the value or speed curve at 60 steps for a smooth line
  c.strokeStyle=cssVar('--acc');c.lineWidth=2;c.lineJoin='round';c.lineCap='round';
  c.beginPath();
  const steps=120;
  for(let i=0;i<=steps;i++){
    const t=v.tMin+(v.tMax-v.tMin)*i/steps;
    let y;
    if(graphMode==='value')y=sampleAt(p,t);
    else{
      // speed = |d value / dt| approximated by central difference
      const dt=0.001;
      y=Math.abs((sampleAt(p,t+dt)-sampleAt(p,t-dt))/(2*dt));
      // scale speed into the value range so it's visible
      y=v.vMin+(y/(v.vMax-v.vMin||1))*(v.vMax-v.vMin)*0.5+v.vMin;
    }
    const px=tX(t),py=pY(y);
    i?c.lineTo(px,py):c.moveTo(px,py);
  }
  c.stroke();
  // keys + bezier handles
  for(let i=0;i<p.keys.length;i++){
    const kk=p.keys[i];
    const px=tX(kk.t),py=pY(kk.v);
    // tether to next key's bezier handle (outgoing handle)
    if(i<p.keys.length-1){
      const b=graphKeyBezier(kk);
      // the bezier handle is in normalized [0,1]x[0,1] (CSS cubic-bezier)
      // space relative to the segment. Map into canvas space.
      const next=p.keys[i+1];
      const segT0=kk.t,segT1=next.t;
      const segV0=kk.v,segV1=next.v;
      const hOutX=tX(segT0+(segT1-segT0)*b[2]);
      const hOutY=pY(segV0+(segV1-segV0)*b[3]);
      c.strokeStyle='rgba(233,231,225,.35)';c.setLineDash([3,3]);c.lineWidth=1;
      c.beginPath();c.moveTo(px,py);c.lineTo(hOutX,hOutY);c.stroke();c.setLineDash([]);
      // small handle dot
      c.beginPath();c.arc(hOutX,hOutY,3,0,6.2832);
      c.fillStyle=cssVar('--acc');c.fill();c.strokeStyle=cssVar('--bg0');c.lineWidth=1.5;c.stroke();
    }
    // incoming handle from the previous key
    if(i>0){
      const prev=p.keys[i-1];
      const b=graphKeyBezier(prev);
      const segT0=prev.t,segT1=kk.t;
      const segV0=prev.v,segV1=kk.v;
      const hInX=tX(segT0+(segT1-segT0)*b[0]);
      const hInY=pY(segV0+(segV1-segV0)*b[1]);
      c.strokeStyle='rgba(233,231,225,.35)';c.setLineDash([3,3]);c.lineWidth=1;
      c.beginPath();c.moveTo(px,py);c.lineTo(hInX,hInY);c.stroke();c.setLineDash([]);
      c.beginPath();c.arc(hInX,hInY,3,0,6.2832);
      c.fillStyle=cssVar('--acc');c.fill();c.strokeStyle=cssVar('--bg0');c.lineWidth=1.5;c.stroke();
    }
    // key dot
    const isSel=selKey&&selKey.kk===kk;
    c.beginPath();c.arc(px,py,isSel?5:4,0,6.2832);
    c.fillStyle=isSel?cssVar('--acc'):'#9BA1AD';c.fill();
    c.strokeStyle=cssVar('--bg0');c.lineWidth=1.5;c.stroke();
  }
  // labels: tMin/tMax/vMin/vMax in the corners
  c.fillStyle=cssVar('--tx3');c.font='500 9px '+cssVar('--mono');
  c.textAlign='left';c.fillText(v.tMin.toFixed(2)+'s',4,H-4);
  c.textAlign='right';c.fillText(v.tMax.toFixed(2)+'s',W-4,H-4);
  c.textAlign='left';c.fillText(v.vMin.toFixed(2),4,12);
  c.textAlign='left';c.fillText(v.vMax.toFixed(2),4,24);
}
function graphKeyBezier(kk){
  // Same logic as the small editor's curBez(), but for any key (not just selKey).
  const e=kk.e;
  if(e&&typeof e==='object'&&Array.isArray(e.bezier)&&e.bezier.length===4&&e.bezier.every(isFinite))
    return e.bezier.slice();
  return(PRESET_REP[e]||PRESET_REP.linear).slice();
}
// Sample the keyframed property at time t (mirrors sample() but works on
// any prop object, not just a layer). Returns the base value if no keys.
function sampleAt(p,t){
  if(!p||!p.keys||!p.keys.length)return p?p.base:0;
  const ks=p.keys;
  if(t<=ks[0].t)return ks[0].v;
  if(t>=ks[ks.length-1].t)return ks[ks.length-1].v;
  for(let i=0;i<ks.length-1;i++){
    const a=ks[i],b=ks[i+1];
    if(t>=a.t&&t<=b.t){
      if(a.e==='hold')return a.v;
      const u=(t-a.t)/Math.max(1e-9,b.t-a.t);
      const f=(a.e&&typeof a.e==='object'&&Array.isArray(a.e.bezier))
        ?bezierEval(a.e.bezier,u):(EASE[a.e]||EASE.linear)(u);
      return a.v+(b.v-a.v)*f;
    }
  }
  return ks[0].v;
}
// Pointer hit-test for graph editor. Returns {kind,key,handleIdx} or null.
function graphHitTest(px,py){
  const cv=$('#graphCanvas');if(!cv||!graphView||!sel)return null;
  const W=cv.clientWidth,H=cv.clientHeight;
  const v=graphView;
  const tX=t=>(t-v.tMin)/(v.tMax-v.tMin)*W;
  const pY=val=>H-(val-v.vMin)/(v.vMax-v.vMin)*H;
  const p=graphPropObj();if(!p||!p.keys)return null;
  for(let i=0;i<p.keys.length;i++){
    const kk=p.keys[i];
    const kx=tX(kk.t),ky=pY(kk.v);
    if(Math.hypot(px-kx,py-ky)<=8)return{kind:'key',key:kk};
    // outgoing handle (from this key to next)
    if(i<p.keys.length-1){
      const b=graphKeyBezier(kk);
      const next=p.keys[i+1];
      const hX=tX(kk.t+(next.t-kk.t)*b[2]);
      const hY=pY(kk.v+(next.v-kk.v)*b[3]);
      if(Math.hypot(px-hX,py-hY)<=8)return{kind:'handleOut',key:kk};
    }
    // incoming handle (from previous key to this key)
    if(i>0){
      const prev=p.keys[i-1];
      const b=graphKeyBezier(prev);
      const hX=tX(prev.t+(kk.t-prev.t)*b[0]);
      const hY=pY(prev.v+(kk.v-prev.v)*b[1]);
      if(Math.hypot(px-hX,py-hY)<=8)return{kind:'handleIn',key:kk,prevKey:prev};
    }
  }
  return null;
}
function graphPointerDown(ev){
  if(!graphOpen)return;
  const cv=$('#graphCanvas');if(!cv)return;
  const r=cv.getBoundingClientRect();
  const px=ev.clientX-r.left,py=ev.clientY-r.top;
  const hit=graphHitTest(px,py);
  if(hit){
    graphDragKind=hit.kind;graphDragKey=hit.key;graphDragMoved=false;
    graphDragPrevKey=hit.prevKey||null;
    // selecting a key also selects it in the timeline (selKey shape: {L,k,kk})
    if(hit.kind==='key'){
      const k=graphCurrentProp();
      selKey={L:sel,k:k,kk:hit.key};
      sel=L;   // ensure the layer is also selected
    }
    try{cv.setPointerCapture(ev.pointerId);}catch(e){}
    ev.preventDefault();
    buildInspector();  // refresh so the small editor reflects the new selection
    graphDraw();
    return;
  }
  // otherwise: pan (drag the view)
  graphDragKind='pan';
  graphDragStartX=ev.clientX;graphDragStartY=ev.clientY;
  graphDragStartView=graphView?{...graphView}:null;
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
}
function graphPointerMove(ev){
  if(!graphOpen||!graphDragKind)return;
  const cv=$('#graphCanvas');if(!cv||!graphView)return;
  const r=cv.getBoundingClientRect();
  const px=ev.clientX-r.left,py=ev.clientY-r.top;
  const W=cv.clientWidth,H=cv.clientHeight;
  const v=graphView;
  if(graphDragKind==='pan'){
    if(!graphDragStartView)return;
    const dx=(ev.clientX-graphDragStartX)/W*(graphDragStartView.tMax-graphDragStartView.tMin);
    const dy=(ev.clientY-graphDragStartY)/H*(graphDragStartView.vMax-graphDragStartView.vMin);
    graphView={...graphDragStartView,tMin:graphDragStartView.tMin-dx,tMax:graphDragStartView.tMax-dx,
      vMin:graphDragStartView.vMin+dy,vMax:graphDragStartView.vMax+dy};
    graphDraw();return;
  }
  // dragging a key or handle: convert px,py back to user units
  const t=v.tMin+(v.tMax-v.tMin)*px/W;
  const val=v.vMin+(v.vMax-v.vMin)*(H-py)/H;
  if(graphDragKind==='key'){
    graphDragKey.t=clamp(t,0,project.dur);
    graphDragKey.v=val;
    graphDragMoved=true;
  }else if(graphDragKind==='handleOut'){
    // outgoing handle: bezier[2]=x (clamped to [0,1] relative to segment),
    // bezier[3]=y (free, can overshoot)
    const p=graphPropObj();if(!p)return;
    const idx=p.keys.indexOf(graphDragKey);
    if(idx<0||idx>=p.keys.length-1)return;
    const next=p.keys[idx+1];
    const segT=next.t-graphDragKey.t,segV=next.v-graphDragKey.v;
    if(Math.abs(segT)<1e-9)return;
    const nx=clamp((t-graphDragKey.t)/segT,0,1);
    const ny=segV!==0?(val-graphDragKey.v)/segV:0;
    const b=graphKeyBezier(graphDragKey);
    b[2]=nx;b[3]=ny;
    graphDragKey.e={bezier:b};
    graphDragMoved=true;
  }else if(graphDragKind==='handleIn'){
    // incoming handle: bezier[0]=x, bezier[1]=y (relative to the previous key's segment)
    const p=graphPropObj();if(!p||!graphDragPrevKey)return;
    const idx=p.keys.indexOf(graphDragPrevKey);
    if(idx<0)return;
    const next=p.keys[idx+1];   // should be graphDragKey
    if(!next||next!==graphDragKey)return;
    const segT=next.t-graphDragPrevKey.t,segV=next.v-graphDragPrevKey.v;
    if(Math.abs(segT)<1e-9)return;
    const nx=clamp((t-graphDragPrevKey.t)/segT,0,1);
    const ny=segV!==0?(val-graphDragPrevKey.v)/segV:0;
    const b=graphKeyBezier(graphDragPrevKey);
    b[0]=nx;b[1]=ny;
    graphDragPrevKey.e={bezier:b};
    graphDragMoved=true;
  }
  touch();dirty=true;
  graphDraw();
  buildInspector();  // sync the small editor's bezier fields
}
function graphPointerUp(){
  if(graphDragMoved)commit('graph');
  graphDragKind=null;graphDragKey=null;graphDragMoved=false;
  graphDragPrevKey=null;graphDragStartView=null;
}
function graphWheel(ev){
  if(!graphOpen||!graphView)return;
  ev.preventDefault();
  const cv=$('#graphCanvas');if(!cv)return;
  const r=cv.getBoundingClientRect();
  const px=(ev.clientX-r.left)/cv.clientWidth;
  const py=(ev.clientY-r.top)/cv.clientHeight;
  const factor=ev.deltaY<0?0.8:1.25;
  const v=graphView;
  // zoom toward cursor
  const tMid=v.tMin+(v.tMax-v.tMin)*px;
  const tHalf=(v.tMax-v.tMin)*0.5*factor;
  const vMid=v.vMin+(v.vMax-v.vMin)*(1-py);
  const vHalf=(v.vMax-v.vMin)*0.5*factor;
  graphView={tMin:tMid-tHalf,tMax:tMid+tHalf,vMin:vMid-vHalf,vMax:vMid+vHalf};
  graphDraw();
}

// ---------- onion skin (cached ghost frames) ----------
// Renders 1..5 ghost frames before and after the current playhead, each
// tinted (past = onion.pastColor, future = onion.futureColor) and fading
// out by onion.falloff. Editor-only — never drawn during exports.
//
// Caching: we keep a small ring of offscreen canvases keyed by frame index
// (rounded). The render loop calls drawOnionSkins() only when project.onion
// is enabled and we're not exporting. With 3 ghosts each side (6 total), the
// cache holds ~6 canvases at the project resolution — well under 50 MB on
// 1080p, and cheap to recompute when the playhead crosses a frame boundary.
const onionCache=new Map();    // frameIdx -> {cv, t}
function onionClearCache(){onionCache.clear();}
function onionFrameForIdx(idx){
  if(onionCache.has(idx))return onionCache.get(idx);
  const fps=project.fps;
  const t=clamp(idx/fps,0,project.dur);
  const cv=document.createElement('canvas');
  cv.width=project.w;cv.height=project.h;
  const c=cv.getContext('2d');
  // Render with motion blur OFF (onion skin uses single samples to stay fast)
  renderProject(c,project,t,{grade:false});
  const entry={cv,t};
  if(onionCache.size>16)onionCache.clear();   // bounded
  onionCache.set(idx,entry);
  return entry;
}
function drawOnionSkins(ctx){
  if(!project.onion||!project.onion.enabled)return;
  if(exporting)return;   // never in exports
  const o=project.onion;
  const n=Math.max(0,Math.min(5,o.ghosts|0));
  if(n===0)return;
  const step=Math.max(1,o.step|0);
  const fps=project.fps;
  const curIdx=Math.round(time*fps);
  // past ghosts
  for(let i=1;i<=n;i++){
    const idx=curIdx-i*step;
    if(idx<0)break;
    const f=onionFrameForIdx(idx);
    const alpha=o.falloff*Math.pow(1-o.falloff*0.5,i-1)*0.7;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.globalCompositeOperation='lighter';   // additive so tints stack visibly
    // tint by drawing the ghost through a colour multiply
    ctx.drawImage(f.cv,0,0);
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle=o.pastColor;
    ctx.globalAlpha=alpha*0.5;
    ctx.fillRect(0,0,project.w,project.h);
    ctx.restore();
  }
  // future ghosts
  for(let i=1;i<=n;i++){
    const idx=curIdx+i*step;
    if(idx/fps>project.dur)break;
    const f=onionFrameForIdx(idx);
    const alpha=o.falloff*Math.pow(1-o.falloff*0.5,i-1)*0.7;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(f.cv,0,0);
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle=o.futureColor;
    ctx.globalAlpha=alpha*0.5;
    ctx.fillRect(0,0,project.w,project.h);
    ctx.restore();
  }
}

// ---------- open project (with validation + clear errors) ----------
// Replaces the silent toast-only loader. Validates structure, reports every
// problem found, and refuses to load if the file is unrecognisable.
function openProjectFile(file){
  if(!file){return;}
  if(!/\.kinema\.json$/i.test(file.name)&&file.type!=='application/json'&&file.type!==''){
    toast('Not a .kinema.json file — picked "'+file.name+'"');
    return;
  }
  file.text().then(txt=>{
    let parsed;
    try{parsed=JSON.parse(txt);}
    catch(err){
      openProjectError('Could not parse JSON',err.message,file.name);
      return;
    }
    if(!parsed||typeof parsed!=='object'){
      openProjectError('Not a project object','The file parsed but is not an object.',file.name);
      return;
    }
    if(!Array.isArray(parsed.layers)){
      openProjectError('Missing layers array',
        'A KINEMA project must have a "layers" array. This file has '+(typeof parsed.layers)+'.',
        file.name);
      return;
    }
    // try sanitize — it throws on truly broken structure
    let cleaned;
    try{cleaned=sanitize(parsed);}
    catch(err){
      openProjectError('Project failed validation',err.message,file.name);
      return;
    }
    project=cleaned;
    afterLoad();
    closeModal();
    toast('Project loaded — '+(project.layers.length)+' layers');
    commit(null,true);
    onionClearCache();   // drop the previous project's ghost frames
  })
  .catch(err=>{
    openProjectError('Could not read file',err.message,file.name);
  });
}
function openProjectError(title,detail,fileName){
  openModal('<div class="mhead"><h2>OPEN PROJECT — ERROR</h2><button class="ibtn mclose">'+ic('x',16)+'</button></div>'
    +'<div style="padding:14px 4px;max-height:300px;overflow-y:auto">'
    +'<p style="color:var(--tx);font-size:13px;margin-bottom:8px"><b>'+esc(title)+'</b></p>'
    +'<p style="color:var(--tx2);font-size:12px;margin-bottom:12px">File: <code style="font:500 11px var(--mono);color:var(--acc)">'+esc(fileName||'(unknown)')+'</code></p>'
    +'<pre style="background:var(--bg0);border:1px solid var(--line);border-radius:6px;padding:10px;font:500 11px var(--mono);color:var(--tx2);white-space:pre-wrap;word-break:break-word">'+esc(detail)+'</pre>'
    +'<p style="color:var(--tx3);font-size:11px;margin-top:12px;line-height:1.5">A KINEMA project must be a JSON object with at least <code>layers</code> (an array) and <code>w</code>, <code>h</code>, <code>dur</code>, <code>fps</code> numbers. Open a saved project file to see the expected shape, or pick a template from TEMPLATES.</p>'

// ---------- performance (preview quality + live FPS readout) ----------
let perfFrames=0,perfLastT=performance.now(),perfFps=0;
function tickPerf(){
  perfFrames++;
  const now=performance.now();
  if(now-perfLastT>=500){
    perfFps=Math.round(perfFrames*1000/(now-perfLastT));
    perfFrames=0;perfLastT=now;
    const el=$('#fpsReadout');
    if(el)el.textContent=perfFps+' FPS';
  }
}
// Apply preview-quality downsample to the live render. Returns a function
// that the render loop calls instead of renderProject(ctx, ...). At 100%
// the call is direct; at 50/25% we render to a smaller offscreen canvas
// and drawImage it back at the full size (so the stage is still the project
// resolution, just blockier — and the frame rate stays high).
let previewScratch=null;
function renderProjectWithPreview(ctx,P,t,opt){
  opt=opt||{};
  const q=P.previewQ||100;
  if(q===100||exporting){
    renderProject(ctx,P,t,opt);
    return;
  }
  const scale=q/100;
  const sw=Math.max(2,Math.round(P.w*scale)),sh=Math.max(2,Math.round(P.h*scale));
  if(!previewScratch||previewScratch.width!==sw||previewScratch.height!==sh){
    previewScratch=document.createElement('canvas');
    previewScratch.width=sw;previewScratch.height=sh;}
  const sc=previewScratch.getContext('2d');
  sc.setTransform(scale,0,0,scale,0,0);
  // Render into the scratch at the scaled resolution. We pass the same opt
  // but force grade off (grading at low res looks worse than no grade).
  renderProject(sc,P,t,Object.assign({},opt,{grade:false}));
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(previewScratch,0,0,P.w,P.h);
}

// ---------- layer timing helpers (split, trim, lock, solo) ----------
// These are called from the timeline layer-bar interactions (built below
// in buildTimelineRowsExt) and from keyboard shortcuts.
function layerSetInPoint(L,t){
  if(L.locked)return;
  L.inPoint=clamp(t,0,project.dur);
  if(L.outPoint<L.inPoint)L.outPoint=L.inPoint;
  touch();commit('inPoint');
}
function layerSetOutPoint(L,t){
  if(L.locked)return;
  L.outPoint=clamp(t,0,project.dur);
  if(L.outPoint<L.inPoint)L.inPoint=L.outPoint;
  touch();commit('outPoint');
}
function layerSplitAtPlayhead(L){
  if(L.locked){toast('Layer is locked');return;}
  // duplicate the layer; the original keeps the [inPoint, time] window, the
  // copy takes [time, outPoint].
  const cp=JSON.parse(JSON.stringify(L,strip));
  cp.id=uid();cp.name=L.name+' (2)';
  cp.inPoint=time;
  cp.outPoint=L.outPoint;
  L.outPoint=time;
  project.layers.splice(project.layers.indexOf(L)+1,0,cp);
  buildLayers();buildTimelineRows();touch();commit('split');
  toast('Layer split at playhead');
}
function layerTrimToPlayhead(L,which){
  if(L.locked){toast('Layer is locked');return;}
  // which: 'in' = trim in-point to playhead; 'out' = trim out-point to playhead
  if(which==='in'){L.inPoint=clamp(time,0,L.outPoint);}
  else{L.outPoint=clamp(time,L.inPoint,project.dur);}
  buildLayers();buildTimelineRows();touch();commit('trim');
}
function layerToggleLock(L){L.locked=!L.locked;buildLayers();buildTimelineRows();touch();commit('lock');}
function layerToggleSolo(L){L.solo=!L.solo;if(project)project._anySolo=undefined;buildLayers();buildTimelineRows();touch();commit('solo');}
// Returns true if a layer should render at time t (inside its in/out window
// AND not muted by the solo system).
function layerIsActiveAt(L,t){
  if(L.solo)return false;   // solo layers always render; this is for the others
  // (solo handling is in renderProject — see the solo-active set check)
  return t>=L.inPoint&&t<=L.outPoint;
}
