// keyboard
addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.isContentEditable)return;
  const k=e.key.toLowerCase(),ctrl=e.ctrlKey||e.metaKey;
  // tool shortcuts (single letter, no modifier)
  if(!ctrl&&!e.altKey){
    if(k==='v'){e.preventDefault();if(pen.on)penCancel();if(draw.on)drawOff();if(point.on)pointOff();if(sb.on)sbOff();select(sel);return;}
    if(k==='p'){e.preventDefault();if(draw.on)drawOff();if(point.on)pointOff();togglePen();return;}
    if(k==='t'){e.preventDefault();addLayer(mkText({text:'HEADLINE',size:130}));return;}
    if(k==='r'){e.preventDefault();addLayer(mkShape({shape:'rect',w:420,h:280,fill:'#F2EFE7'}));return;}
    if(k==='e'){e.preventDefault();addLayer(mkShape({shape:'ellipse',w:300,h:300,fill:'#FF4D26'}));return;}
    if(k==='b'){e.preventDefault();toggleDraw();return;}
    if(k==='c'){e.preventDefault();if(project.layers.some(l=>l.type==='camera')){toast('Only one camera allowed');return;}addLayer(mkCamera({}));return;}
    if(k==='g'){e.preventDefault();gridOn=!gridOn;$('#tgGrid').classList.toggle('on',gridOn);dirty=true;return;}
    if(k==='n'){e.preventDefault();togglePoint();return;}
    if(k==='m'){e.preventDefault();toggleShapeBuilder();return;}
    if(k==='?'){e.preventDefault();openShortcutsModal();return;}
    if(k==='/'){e.preventDefault();openShortcutsModal();return;}
  }
  // draw/pen/point tool escapes
  if(draw.on&&!exporting){
    if(e.key==='Escape'){e.preventDefault();drawOff();return;}}
  if(pen.on&&!exporting){
    if(e.key==='Enter'){e.preventDefault();penFinish();return;}
    if(e.key==='Escape'){e.preventDefault();penCancel();return;}}
  if(point.on&&!exporting){
    if(e.key==='Escape'){e.preventDefault();pointOff();return;}
    if(e.key==='Delete'||e.key==='Backspace'){if(point.sel.size){e.preventDefault();deleteSelectedAnchors();return;}}
    // Arrow key nudge
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){
      e.preventDefault();
      const step=e.shiftKey?10:1;
      const L=layerById(point.editId);if(!L)return;
      const anchors=penFromD(L.d);
      const dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;
      const dy=e.key==='ArrowUp'?step:e.key==='ArrowDown'?-step:0;
      for(const idx of point.sel){
        if(idx>=0&&idx<anchors.length){
          anchors[idx].p[0]+=dx;anchors[idx].p[1]+=dy;
          if(anchors[idx].out){anchors[idx].out[0]+=dx;anchors[idx].out[1]+=dy;}
          if(anchors[idx].in){anchors[idx].in[0]+=dx;anchors[idx].in[1]+=dy;}}}
      pen.anchors=anchors;pen.closed=!!L.closed;L.d=penToD();
      touch();commit('pointnudge');dirty=true;return;}}
  if(sb.on&&!exporting){
    if(e.key==='Escape'){e.preventDefault();sbOff();return;}}
  // timeline: J/K/L (reverse/pause/forward), arrows step frames
  if(!ctrl&&!e.altKey&&!pen.on&&!draw.on){
    if(k==='j'){e.preventDefault();
      setTime(clamp(time-1/project.fps,0,project.dur));return;}
    if(k==='l'){e.preventDefault();
      setTime(clamp(time+1/project.fps,0,project.dur));return;}
    if(k==='k'){e.preventDefault();$('#btnPlay').click();return;}
    if(e.key==='ArrowLeft'){e.preventDefault();
      setTime(clamp(time-(e.shiftKey?10:1)/project.fps,0,project.dur));return;}
    if(e.key==='ArrowRight'){e.preventDefault();
      setTime(clamp(time+(e.shiftKey?10:1)/project.fps,0,project.dur));return;}
  }
  // layer nudge with arrow keys
  if(sel&&!pen.on&&!draw.on&&!ctrl){
    if(e.key==='ArrowLeft'){e.preventDefault();setVal(sel,'x',sample(sel,'x',time)-(e.shiftKey?10:1));commit('nudge');return;}
    if(e.key==='ArrowRight'){e.preventDefault();setVal(sel,'x',sample(sel,'x',time)+(e.shiftKey?10:1));commit('nudge');return;}
    if(e.key==='ArrowUp'){e.preventDefault();setVal(sel,'y',sample(sel,'y',time)+(e.shiftKey?10:1));commit('nudge');return;}
    if(e.key==='ArrowDown'){e.preventDefault();setVal(sel,'y',sample(sel,'y',time)-(e.shiftKey?10:1));commit('nudge');return;}
  }
  // space = play/pause (in present mode the #btnPlay is display:none, so
  // toggle playback directly instead of clicking the hidden button)
  if(e.code==='Space'){
    e.preventDefault();
    if(document.body.classList.contains('present')){
      playing=!playing;
      if(playing&&time>=project.dur)time=0;
      updPlayBtn();
    }else $('#btnPlay').click();
    return;
  }
  if(e.key==='Home'){time=0;dirty=true;return;}
  if(e.key==='End'){time=project.dur;dirty=true;return;}
  if(e.key==='Escape'){
    if(document.body.classList.contains('present')){exitPresentMode();e.preventDefault();return;}
    if(!$('#modal').classList.contains('hidden'))closeModal();
    else{selKey=null;select(null);return;}}
  // undo/redo
  if(ctrl&&!e.altKey&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(ctrl&&k==='y'){e.preventDefault();redo();return;}
  // delete keyframe
  if(e.key==='Delete'||e.key==='Backspace'){if(selKey){delKey();e.preventDefault();return;}}
  // keyframe copy/cut/paste (Ctrl+Shift+C/X/V for keys, to distinguish from layer copy)
  if(ctrl&&e.shiftKey&&k==='c'&&selKeys.size){e.preventDefault();copyKeys();return;}
  if(ctrl&&e.shiftKey&&k==='x'&&selKeys.size){e.preventDefault();cutKeys();return;}
  if(ctrl&&e.shiftKey&&k==='v'){e.preventDefault();pasteKeys();return;}
  if(ctrl&&e.shiftKey&&k==='p'){e.preventDefault();openPathMenu();return;}
  if(ctrl&&e.shiftKey&&k==='f'){e.preventDefault();openVectorForge();return;}
  // copy/cut/paste/duplicate layers
  if(ctrl&&k==='c'&&sel){e.preventDefault();clipboard=JSON.parse(JSON.stringify(sel,strip));clipboard.id=uid();return;}
  if(ctrl&&k==='x'&&sel){e.preventDefault();clipboard=JSON.parse(JSON.stringify(sel,strip));clipboard.id=uid();
    project.layers.splice(project.layers.indexOf(sel),1);select(null);buildLayers();buildTimelineRows();touch();commit('cut');return;}
  if(ctrl&&k==='v'&&clipboard){e.preventDefault();
    const cp=JSON.parse(JSON.stringify(clipboard,strip));cp.id=uid();cp.name=clipboard.name+' copy';
    project.layers.unshift(cp);select(cp);buildLayers();buildTimelineRows();touch();commit('paste');return;}
  if(ctrl&&k==='d'&&sel){e.preventDefault();
    const cp=JSON.parse(JSON.stringify(sel,strip));cp.id=uid();cp.name=sel.name+' copy';
    project.layers.splice(project.layers.indexOf(sel),0,cp);select(cp);buildLayers();buildTimelineRows();touch();commit('dup');return;}
  // reorder layers Ctrl+] and Ctrl+[
  if(ctrl&&(e.key===']'||k===']')){e.preventDefault();
    if(sel){const i=project.layers.indexOf(sel);if(i>0){
      project.layers.splice(i,1);project.layers.splice(i-1,0,sel);
      buildLayers();buildTimelineRows();touch();commit('reorder');}}return;}
  if(ctrl&&(e.key==='['||k==='[')){e.preventDefault();
    if(sel){const i=project.layers.indexOf(sel);if(i<project.layers.length-1){
      project.layers.splice(i,1);project.layers.splice(i+1,0,sel);
      buildLayers();buildTimelineRows();touch();commit('reorder');}}return;}
  // Ctrl+S save project JSON
  if(ctrl&&k==='s'){e.preventDefault();saveJSON();return;}
  // Ctrl+O = open project (file picker)
  if(ctrl&&k==='o'){e.preventDefault();$('#fileIn').click();return;}
});
let clipboard=null;
addEventListener('resize',()=>{if(project)buildTimelineRows();});

// ---------- boot ----------
(function boot(){
  loadVS();                              // restore virtual stylus settings from localStorage
  loadDRAW();                           // restore draw tool settings (K4)
  let saved=null;
  // Embedded project: if a <script type="application/json" id="embedded-project">
  // tag is present in the document, load it INSTEAD of localStorage. This lets
  // a single-file KINEMA HTML embed a project that opens on boot (e.g. for
  // present mode / shareable demo links).
  const embedded=document.getElementById('embedded-project');
  if(embedded&&embedded.textContent.trim()){
    try{
      const ep=JSON.parse(embedded.textContent);
      if(ep&&ep.layers)project=sanitize(ep);
      else saved=null;
    }catch(e){console.warn('Embedded project parse failed, falling back to localStorage:',e);}
  }
  if(!project){
    try{saved=JSON.parse(localStorage.getItem('kinema.project'));}catch(e){}
    if(saved&&saved.layers)project=sanitize(saved);
    else project=sanitize(JSON.parse(JSON.stringify(BUILTINS[0].project)));
  }
  afterLoad();
  syncPerfOnionUI();   // re-sync perf selector + onion pill now that project exists
  commit(null,true);
  document.fonts.ready.then(()=>{rasterCache.clear();dirty=true;});
  FONTS.forEach(f=>{document.fonts.load((FONTW[f]||700)+' 80px "'+f+'"').then(()=>{rasterCache.clear();dirty=true;}).catch(()=>{});});
  if(!saved)setTimeout(()=>toast('A template is already playing — open TEMPLATES to start from another'),700);

  // ---- Present mode: read URL hash on boot and on hashchange ----
  function syncPresentFromHash(){
    if(location.hash==='#present'){
      if(!document.body.classList.contains('present'))enterPresentMode();
    }else{
      if(document.body.classList.contains('present'))exitPresentMode();
    }
  }
  syncPresentFromHash();
  addEventListener('hashchange',syncPresentFromHash);

  // ---- Present-mode transport bar wiring ----
  $('#pbPlay').addEventListener('click',()=>{
    playing=!playing;
    if(playing&&time>=project.dur)time=0;
    updPlayBtn();
  });
  $('#pbScrub').addEventListener('click',ev=>{
    const r=ev.currentTarget.getBoundingClientRect();
    const frac=clamp((ev.clientX-r.left)/r.width,0,1);
    setTime(frac*project.dur);
    playing=false;updPlayBtn();
  });
  $('#pbExit').addEventListener('click',exitPresentMode);

  window.KINEMA={renderProject:renderProject,BUILTINS:BUILTINS,OCCASIONS:OCCASIONS,seed:__seed,pj:pj,mkText:mkText,mkShape:mkShape,mkImage:mkImage,mkParticle:mkParticle,mkPath:mkPath,mkNull:mkNull,mkCamera:mkCamera,K:K,B:B,fo:fo};
requestAnimationFrame(tick);
})();
</script>
