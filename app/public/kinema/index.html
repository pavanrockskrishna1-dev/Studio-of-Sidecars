  if(p0.closeAfter)return; // can't insert on a closeAfter boundary
  const c1=p0.out||p0.p,c2=p1.in||p1.p;
  const mt=1-t;
  const x=mt*mt*mt*p0.p[0]+3*mt*mt*t*c1[0]+3*mt*t*t*c2[0]+t*t*t*p1.p[0];
  const y=mt*mt*mt*p0.p[1]+3*mt*mt*t*c1[1]+3*mt*t*t*c2[1]+t*t*t*p1.p[1];
  // Split handles
  const newIn=[mt*c1[0]+t*c2[0]*0,mt*c1[1]+t*c2[1]*0]; // simplified
  const newOut=[mt*c2[0]+t*p1.p[0],mt*c2[1]+t*p1.p[1]];
  // De Casteljau split for proper handle preservation
  const p0c1x=mt*p0.p[0]+t*c1[0],p0c1y=mt*p0.p[1]+t*c1[1];
  const c1c2x=mt*c1[0]+t*c2[0],c1c2y=mt*c1[1]+t*c2[1];
  const c2p1x=mt*c2[0]+t*p1.p[0],c2p1y=mt*c2[1]+t*p1.p[1];
  const p0c1c2x=mt*p0c1x+t*c1c2x,p0c1c2y=mt*p0c1y+t*c1c2y;
  const c1c2p1x=mt*c1c2x+t*c2p1x,c1c2p1y=mt*c1c2y+t*c2p1y;
  const px=mt*p0c1c2x+t*c1c2p1x,py=mt*p0c1c2y+t*c1c2p1y;
  // Update handles
  if(p0.out){p0.out=[p0c1x,p0c1y];}
  const newAnchor={p:[px,py],in:[p0c1c2x,p0c1c2y],out:[c1c2p1x,c1c2p1y],closeAfter:false};
  if(p1.in){p1.in=[c2p1x,c2p1y];}
  anchors.splice(i+1,0,newAnchor);}
// Delete selected anchors and rebuild d
function deleteSelectedAnchors(){
  const L=layerById(point.editId);if(!L)return;
  const anchors=penFromD(L.d);

  if(remaining.length<2){toast('Need at least 2 anchors');return;}
  // Rebuild d

// Save current state to the layer
function pointSaveToLayer(){

  // The anchors are the layer's d — we edit d in place via penFromD/penToD
  // So we need to rebuild d from the current anchors.
  // Since we modify anchors in place (penFromD returns a fresh array each time),
  // we store the anchors in pen.anchors and call penToD.
  // But we don't use pen.anchors — we edit the layer's d directly.
  // So we need a different approach: keep a working copy of the anchors.

// Snap to grid/guides (reuse existing snapLayerPos for layer-level snapping)
function pointSnap(local){
  if(!gridOn)return local;
  // Snap to nearest grid line (grid is 24px in stage space)
  const r=stage.getBoundingClientRect();
  const scale=r.width/stage.width;
  const grid=24/scale/stageZoom; // grid in layer units
  return{x:Math.round(local.x/grid)*grid,y:Math.round(local.y/grid)*grid};}
// Pointer handling
function pointDown(e){
  if(exporting||!point.on)return;
  const sp=stagePos(e);const p=pointLocal(sp.x,sp.y);if(!p)return;
  const L=layerById(point.editId);if(!L)return;
  const pre=ancestorXf(L,CUR_T);
  const pr=q=>tp(L,q[0],q[1],0,pre);
  const anchors=penFromD(L.d);
  // Hit-test handles first
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i];
    for(const k of ['out','in']){
      if(!a[k])continue;
      const q=pr(a[k]);
      if(Math.hypot(q.x-sp.x,q.y-sp.y)<11){
        e.preventDefault();stage.setPointerCapture(e.pointerId);
        point.drag={kind:k,idx:i,off:[a[k][0]-p.x,a[k][1]-p.y],anchors};
        return;}}}
  // Hit-test anchors
  let hit=-1,hd=1e9;
  for(let i=0;i<anchors.length;i++){
    const q=pr(anchors[i].p),dd=Math.hypot(q.x-sp.x,q.y-sp.y);
    if(dd<14&&dd<hd){hd=dd;hit=i;}}
  if(hit>=0){
    e.preventDefault();stage.setPointerCapture(e.pointerId);
    if(!e.shiftKey)point.sel.clear();
    point.sel.add(hit);
    point.drag={kind:'anchor',idx:hit,off:[anchors[hit].p[0]-p.x,anchors[hit].p[1]-p.y],anchors};
    dirty=true;return;}
  // Hit-test segments (insert point)
  for(let i=0;i<anchors.length-1;i++){
    if(anchors[i].closeAfter)continue;
    const t=segmentHit(sp,anchors[i],anchors[i+1],pr);
    if(t!==null){
      e.preventDefault();stage.setPointerCapture(e.pointerId);
      // Insert and select
      insertPointOnSegment(anchors,i,t);
      // Write back to layer
      pen.anchors=anchors;pen.closed=!!L.closed;L.d=penToD();
      point.sel.clear();point.sel.add(i+1);
      touch();commit('pointinsert');dirty=true;
      return;}}
  // Box select
  if(!e.shiftKey)point.sel.clear();
  point.boxSel={x0:sp.x,y0:sp.y,x1:sp.x,y1:sp.y};
  e.preventDefault();stage.setPointerCapture(e.pointerId);
  dirty=true;}
function segmentHit(sp,a0,a1,pr){
  // Sample the segment at 20 points and find the closest
  const c1=a0.out||a0.p,c2=a1.in||a1.p;
  let bestT=null,bestD=8; // 8px hit radius
  for(let i=0;i<=20;i++){
    const t=i/20,mt=1-t;
    const x=mt*mt*mt*a0.p[0]+3*mt*mt*t*c1[0]+3*mt*t*t*c2[0]+t*t*t*a1.p[0];
    const y=mt*mt*mt*a0.p[1]+3*mt*mt*t*c1[1]+3*mt*t*t*c2[1]+t*t*t*a1.p[1];
    const q=pr([x,y]);

function pointMove(e){
  if(!point.on)return;
  const sp=stagePos(e);point.mouse={sx:sp.x,sy:sp.y};
  if(point.boxSel){point.boxSel.x1=sp.x;point.boxSel.y1=sp.y;dirty=true;return;}
  if(!point.drag)return;
  const p=pointLocal(sp.x,sp.y);if(!p)return;
  const a=point.drag.anchors[point.drag.idx];if(!a)return;
  if(point.drag.kind==='anchor'){
    let nx=p.x+point.drag.off[0],ny=p.y+point.drag.off[1];
    // Snap to grid
    if(gridOn){const s=pointSnap({x:nx,y:ny});nx=s.x;ny=s.y;}
    const dx=nx-a.p[0],dy=ny-a.p[1];
    a.p[0]=nx;a.p[1]=ny;
    if(a.out){a.out[0]+=dx;a.out[1]+=dy;}
    if(a.in){a.in[0]+=dx;a.in[1]+=dy;}}
  else if(point.drag.kind==='out'||point.drag.kind==='in'){
    a[point.drag.kind]=[p.x,p.y];

    pen.anchors=point.drag.anchors;pen.closed=!!L.closed;L.d=penToD();

function pointUp(e){
  if(!point.on)return;

      const y0=Math.min(point.boxSel.y0,point.boxSel.y1),y1=Math.max(point.boxSel.y0,point.boxSel.y1);

// Double-click: cycle anchor mode
stage.addEventListener('dblclick',e=>{

// Draw overlay
function drawPointOverlay(ctx){

// ---------- PATH MENU (Inkscape-style path operations) ----------
// Existing operations already in the engine:
//   Unite (boolOp 'unite'), Subtract (boolOp 'sub'), Intersect (boolOp 'int')
//   Contour/Offset (contourPolygon + offsetPolygon + contourUI)
//
// New operations added below:
//   Exclusion (XOR), Division, Cut Path, Combine, Break Apart,
//   Object to Path, Stroke to Path, Inset, Outset, Dynamic Offset,
//   Simplify, Reverse, Trace Bitmap

// ---- Exclusion (XOR) ----
// A XOR B = (A union B) minus (A intersect B). Implemented as two boolean
// passes: first unite, then subtract the intersection.
function pathExclusion(){
  const picks=boolPicks();
  if(picks.length<2){toast('Select 2+ shape/path layers');return;}
  const t=time,W=project.w,H=project.h;
  const Pbg=Object.assign({},project,{bg:'rgba(0,0,0,0)'});
  // Render union
  const unionC=document.createElement('canvas');unionC.width=W;unionC.height=H;
  const ucx=unionC.getContext('2d');
  picks.forEach(L=>{const c=document.createElement('canvas');c.width=W;c.height=H;
    renderProject(c.getContext('2d'),Pbg,t,{filter:x=>x.id===L.id});ucx.drawImage(c,0,0);});
  // Render intersection
  const interC=document.createElement('canvas');interC.width=W;interC.height=H;
  const icx=interC.getContext('2d');
  picks.forEach((L,i)=>{const c=document.createElement('canvas');c.width=W;c.height=H;
    renderProject(c.getContext('2d'),Pbg,t,{filter:x=>x.id===L.id});
    icx.globalCompositeOperation=i===0?'source-over':'destination-in';
    icx.drawImage(c,0,0);});
  // XOR = union minus intersection
  ucx.globalCompositeOperation='destination-out';
  ucx.drawImage(interC,0,0);
  ucx.globalCompositeOperation='source-over';
  // Trace
  const ring=traceOutline(ucx.getImageData(0,0,W,H).data,W,H,128);
  if(!ring||ring.length<12){toast('Nothing traced');return;}
  const poly=rdp(ring,2);
  if(poly.length<3){toast('Result collapsed');return;}
  const cx=picks.reduce((s,l)=>s+sample(l,'x',t),0)/picks.length;
  const cy=picks.reduce((s,l)=>s+sample(l,'y',t),0)/picks.length;
  const CX=W/2,CY=H/2;
  const d=[{type:'M',pts:[[poly[0].x-CX-cx,CY-poly[0].y-cy]]}];
  for(let i=1;i<poly.length;i++)d.push({type:'L',pts:[[poly[i].x-CX-cx,CY-poly[i].y-cy]]});
  d.push({type:'Z',pts:[]});
  const A=picks[0];
  const nl=mkPath({d:d,closed:true,name:'Exclusion',fill:A.fill,strokeW:A.strokeW,strokeColor:A.strokeColor});
  nl.props.x=B(cx);nl.props.y=B(cy);
  const at=Math.max(0,project.layers.indexOf(A));
  const gone=new Set(picks.map(l=>l.id));
  project.layers=project.layers.filter(l=>!gone.has(l.id));
  project.layers.splice(Math.min(at,project.layers.length),0,nl);
  selIds.clear();select(nl);buildLayers();buildTimelineRows();touch();commit('exclusion',true);
  dirty=true;toast('Exclusion — '+poly.length+'-point path created');}

// ---- Division ----
// Cut the bottom shape into pieces along the top shape's outline.
// Renders A minus B, then B minus A, then A intersect B → up to 3 result paths.
function pathDivision(){
  const picks=boolPicks();
  if(picks.length<2){toast('Select 2+ shape/path layers');return;}
  const t=time,W=project.w,H=project.h;
  const Pbg=Object.assign({},project,{bg:'rgba(0,0,0,0)'});
  // NB: local var is `btm` (not `B`) so the global B() keyframe-wrapper
  // function (used at the bottom: nl.props.x=B(cx)) stays in scope.
  const A=picks[0],btm=picks[1];
  const results=[];
  const modes=[
    {name:'Div-AminusB',comp:(cx,imgA,imgB)=>{cx.drawImage(imgA,0,0);cx.globalCompositeOperation='destination-out';cx.drawImage(imgB,0,0);cx.globalCompositeOperation='source-over';}},
    {name:'Div-BminusA',comp:(cx,imgA,imgB)=>{cx.drawImage(imgB,0,0);cx.globalCompositeOperation='destination-out';cx.drawImage(imgA,0,0);cx.globalCompositeOperation='source-over';}},
    {name:'Div-intersect',comp:(cx,imgA,imgB)=>{cx.drawImage(imgA,0,0);cx.globalCompositeOperation='destination-in';cx.drawImage(imgB,0,0);cx.globalCompositeOperation='source-over';}},
  ];
  const imgA=document.createElement('canvas');imgA.width=W;imgA.height=H;
  renderProject(imgA.getContext('2d'),Pbg,t,{filter:x=>x.id===A.id});
  const imgB=document.createElement('canvas');imgB.width=W;imgB.height=H;
  renderProject(imgB.getContext('2d'),Pbg,t,{filter:x=>x.id===btm.id});
  const cx=picks.reduce((s,l)=>s+sample(l,'x',t),0)/picks.length;
  const cy=picks.reduce((s,l)=>s+sample(l,'y',t),0)/picks.length;
  const CX=W/2,CY=H/2;
  for(const mode of modes){
    const bc=document.createElement('canvas');bc.width=W;bc.height=H;
    const bcx=bc.getContext('2d');
    mode.comp(bcx,imgA,imgB);
    const ring=traceOutline(bcx.getImageData(0,0,W,H).data,W,H,128);
    if(!ring||ring.length<12)continue;
    const poly=rdp(ring,2);
    if(poly.length<3)continue;
    const d=[{type:'M',pts:[[poly[0].x-CX-cx,CY-poly[0].y-cy]]}];
    for(let i=1;i<poly.length;i++)d.push({type:'L',pts:[[poly[i].x-CX-cx,CY-poly[i].y-cy]]});
    d.push({type:'Z',pts:[]});
    const nl=mkPath({d:d,closed:true,name:mode.name,fill:A.fill,strokeW:A.strokeW,strokeColor:A.strokeColor});
    nl.props.x=B(cx);nl.props.y=B(cy);
    results.push(nl);}
  if(results.length===0){toast('Division produced no pieces');return;}
  const at=Math.max(0,project.layers.indexOf(A));
  const gone=new Set(picks.map(l=>l.id));
  project.layers=project.layers.filter(l=>!gone.has(l.id));
  results.forEach((r,i)=>project.layers.splice(Math.min(at+i,project.layers.length),0,r));
  selIds.clear();select(results[0]);buildLayers();buildTimelineRows();touch();commit('division',true);
  dirty=true;toast('Division — '+results.length+' pieces created');}

// ---- Cut Path ----
// Cut a path's stroke along another path. Works on two path layers: the
// bottom path is split at intersection points with the top path.
function pathCutPath(){
  const picks=boolPicks();
  if(picks.length<2){toast('Select 2 path layers');return;}
  // NB: local var is `btm` (not `B`) so the global B() keyframe-wrapper
  // function (used at the bottom: nl.props.x=B(cx)) stays in scope.
  const A=picks[0],btm=picks[1];
  if(A.type!=='path'||btm.type!=='path'){toast('Both layers must be paths');return;}
  // Simplified: use the raster approach — render A's stroke, mask by btm,
  // and trace the pieces. This is not as precise as vector intersection
  // but works for any path shape.
  const t=time,W=project.w,H=project.h;
  const Pbg=Object.assign({},project,{bg:'rgba(0,0,0,0)'});
  // Render A's stroke only (no fill)
  const imgA=document.createElement('canvas');imgA.width=W;imgA.height=H;
  const aCtx=imgA.getContext('2d');
  // Temporarily set fill to none, render, restore
  const oldFill=A.fill;A.fill='none';
  renderProject(aCtx,Pbg,t,{filter:x=>x.id===A.id});
  A.fill=oldFill;
  // Render btm as a mask
  const imgB=document.createElement('canvas');imgB.width=W;imgB.height=H;
  renderProject(imgB.getContext('2d'),Pbg,t,{filter:x=>x.id===btm.id});
  // Cut: A minus B
  aCtx.globalCompositeOperation='destination-out';
  aCtx.drawImage(imgB,0,0);
  aCtx.globalCompositeOperation='source-over';
  const ring=traceOutline(aCtx.getImageData(0,0,W,H).data,W,H,128);
  if(!ring||ring.length<12){toast('Cut path produced nothing');return;}
  const poly=rdp(ring,2);
  const cx=sample(A,'x',t),cy=sample(A,'y',t);
  const CX=W/2,CY=H/2;
  const d=[{type:'M',pts:[[poly[0].x-CX-cx,CY-poly[0].y-cy]]}];
  for(let i=1;i<poly.length;i++)d.push({type:'L',pts:[[poly[i].x-CX-cx,CY-poly[i].y-cy]]});
  d.push({type:'Z',pts:[]});
  const nl=mkPath({d:d,closed:true,name:'Cut Path',fill:'none',strokeW:A.strokeW,strokeColor:A.strokeColor});
  nl.props.x=B(cx);nl.props.y=B(cy);
  const at=Math.max(0,project.layers.indexOf(A));
  const gone=new Set([A.id]); // only remove A, keep B
  project.layers=project.layers.filter(l=>!gone.has(l.id));
  project.layers.splice(Math.min(at,project.layers.length),0,nl);
  selIds.clear();select(nl);buildLayers();buildTimelineRows();touch();commit('cutpath',true);
  dirty=true;toast('Cut Path — stroke cut along intersecting path');}

// ---- Combine (multiple paths → one compound path) ----
function pathCombine(){
  const picks=boolPicks();
  if(picks.length<2){toast('Select 2+ path layers');return;}
  const A=picks[0];
  // Merge all d arrays into one
  const d=[];
  for(const L of picks){if(L.type==='path'&&L.d){d.push(...L.d);d.push({type:'Z',pts:[]});}}
  if(d.length<4){toast('Nothing to combine');return;}
  const nl=mkPath({d:d,closed:true,name:'Combined',fill:A.fill,strokeW:A.strokeW,strokeColor:A.strokeColor});
  const at=Math.max(0,project.layers.indexOf(A));
  const gone=new Set(picks.map(l=>l.id));
  project.layers=project.layers.filter(l=>!gone.has(l.id));
  project.layers.splice(Math.min(at,project.layers.length),0,nl);
  selIds.clear();select(nl);buildLayers();buildTimelineRows();touch();commit('combine',true);
  dirty=true;toast('Combine — '+picks.length+' paths merged into one');}

// ---- Break Apart (compound path → separate paths) ----
function pathBreakApart(){
  if(!sel||sel.type!=='path'){toast('Select a path layer');return;}
  const L=sel;
  // Split d at every Z (except the last if the path is closed)
  const subpaths=[];
  let cur=[];
  for(const s of L.d){
    cur.push(s);
    if(s.type==='Z'){subpaths.push(cur);cur=[];}}
  if(cur.length>0)subpaths.push(cur);
  if(subpaths.length<=1){toast('Path has only one subpath — nothing to break');return;}
  const at=Math.max(0,project.layers.indexOf(L));
  project.layers.splice(at,1);
  subpaths.forEach((sp,i)=>{
    const nl=mkPath({d:sp,closed:true,name:L.name+' '+(i+1),
      fill:L.fill,strokeW:L.strokeW,strokeColor:L.strokeColor});
    nl.props.x=L.props.x;nl.props.y=L.props.y;
    project.layers.splice(Math.min(at+i,project.layers.length),0,nl);});
  select(null);buildLayers();buildTimelineRows();touch();commit('breakapart',true);
  dirty=true;toast('Break Apart — '+subpaths.length+' paths created');}

// ---- Object to Path (shapes and text → editable paths) ----
function pathObjectToPath(){
  if(!sel){toast('Select a layer');return;}
  const L=sel;
  if(L.type==='path'){toast('Already a path');return;}
  if(L.type!=='shape'&&L.type!=='text'){toast('Only shapes and text can be converted');return;}
  let pts;
  if(L.type==='shape'){pts=outlinePts(L);}
  else if(L.type==='text'){
    // Render text to canvas, trace outline
    const W=project.w,H=project.h;
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const Pbg=Object.assign({},project,{bg:'rgba(0,0,0,0)'});
    renderProject(c.getContext('2d'),Pbg,time,{filter:x=>x.id===L.id});
    const ring=traceOutline(c.getContext('2d').getImageData(0,0,W,H).data,W,H,128);
    if(!ring||ring.length<6){toast('Text too small to trace');return;}
    const poly=rdp(ring,1.5);
    pts=poly.map(p=>[p.x-W/2-sample(L,'x',time),H/2-p.y-sample(L,'y',time)]);}
  if(!pts||pts.length<3){toast('Could not extract outline');return;}
  const d=[{type:'M',pts:[[pts[0][0],pts[0][1]]]}];
  for(let i=1;i<pts.length;i++)d.push({type:'L',pts:[[pts[i][0],pts[i][1]]]});
  d.push({type:'Z',pts:[]});
  const at=Math.max(0,project.layers.indexOf(L));
  const nl=mkPath({d:d,closed:true,name:L.name,fill:L.fill||'#F2EFE7',strokeW:L.strokeW||0,strokeColor:L.strokeColor||'#0F1013'});
  nl.props.x=L.props.x;nl.props.y=L.props.y;
  project.layers.splice(at,1,nl);
  select(nl);buildLayers();buildTimelineRows();touch();commit('obj2path',true);
  dirty=true;toast('Object to Path — '+pts.length+' nodes');}

// ---- Stroke to Path (outline a stroke as a filled path) ----
function pathStrokeToPath(){
  if(!sel||sel.type!=='path'){toast('Select a path layer with a stroke');return;}
  const L=sel;
  if(!L.strokeW||L.strokeW<=0){toast('No stroke to outline');return;}
  // Render the stroke only (fill=none) to canvas, trace the outline
  const W=project.w,H=project.h,t=time;
  const Pbg=Object.assign({},project,{bg:'rgba(0,0,0,0)'});
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const oldFill=L.fill;L.fill='none';
  renderProject(c.getContext('2d'),Pbg,t,{filter:x=>x.id===L.id});
  L.fill=oldFill;
  const ring=traceOutline(c.getContext('2d').getImageData(0,0,W,H).data,W,H,128);
  if(!ring||ring.length<12){toast('Stroke too thin to trace');return;}
  const poly=rdp(ring,1.5);
  const cx=sample(L,'x',t),cy=sample(L,'y',t);
  const CX=W/2,CY=H/2;
  const d=[{type:'M',pts:[[poly[0].x-CX-cx,CY-poly[0].y-cy]]}];
  for(let i=1;i<poly.length;i++)d.push({type:'L',pts:[[poly[i].x-CX-cx,CY-poly[i].y-cy]]});
  d.push({type:'Z',pts:[]});
  const at=Math.max(0,project.layers.indexOf(L));
  const nl=mkPath({d:d,closed:true,name:L.name+' (stroke)',
    fill:L.strokeColor||'#0F1013',strokeW:0});
  nl.props.x=L.props.x;nl.props.y=L.props.y;
  project.layers.splice(at,1,nl);
  select(nl);buildLayers();buildTimelineRows();touch();commit('stroke2path',true);
  dirty=true;toast('Stroke to Path — '+poly.length+' nodes (fill = stroke color)');}

// ---- Inset / Outset (by a distance, replacing the layer) ----
function pathInset(distance){
  if(!sel){toast('Select a path or shape layer');return;}
  const L=sel;
  const poly=contourPolygon(L);
  if(!poly||poly.length<3){toast('Layer has no outline to inset');return;}
  const offset=offsetPolygon(poly,-Math.abs(distance),'Miter');
  if(!offset||offset.length<3){toast('Inset collapsed the shape');return;}
  const d=[{type:'M',pts:[[offset[0].x,offset[0].y]]}];
  for(let i=1;i<offset.length;i++)d.push({type:'L',pts:[[offset[i].x,offset[i].y]]});
  d.push({type:'Z',pts:[]});
  L.type='path';L.d=d;L.closed=true;
  if(L.shape)delete L.shape;
  touch();commit('inset',true);buildLayers();buildInspector();dirty=true;
  toast('Inset by '+distance+'px — '+offset.length+' nodes');}

function pathOutset(distance){
  if(!sel){toast('Select a path or shape layer');return;}
  const L=sel;
  const poly=contourPolygon(L);
  if(!poly||poly.length<3){toast('Layer has no outline to outset');return;}
  const offset=offsetPolygon(poly,Math.abs(distance),'Miter');
  if(!offset||offset.length<3){toast('Outset collapsed the shape');return;}
  const d=[{type:'M',pts:[[offset[0].x,offset[0].y]]}];
  for(let i=1;i<offset.length;i++)d.push({type:'L',pts:[[offset[i].x,offset[i].y]]});
  d.push({type:'Z',pts:[]});
  L.type='path';L.d=d;L.closed=true;
  if(L.shape)delete L.shape;
  touch();commit('outset',true);buildLayers();buildInspector();dirty=true;
  toast('Outset by '+distance+'px — '+offset.length+' nodes');}

// ---- Dynamic Offset (live offset keyed to a distance property) ----
// Adds an offsetDist property to the layer (already seeded by mkPath at 0).
// This op ensures the property exists and is wired into PATH_PROP_KEYS so it
// shows up in the inspector with a keyframe diamond + expression button, AND
// in the timeline as its own lane. drawPath reads offsetDist at render time
// and substitutes an offsetPolygon when the value is non-zero — see drawPath.
//
// Keyframes + expressions work for free because offsetDist is a regular
// B()-wrapped prop on L.props. The user can right-click the inspector row to
// add an expression like "Math.sin(time*2)*20" for a breathing outline.
function pathDynamicOffset(){
  if(!sel){toast('Select a path or shape layer');return;}
  const L=sel;
  // Convert to path first if it's a shape (path ops need a path).
  if(L.type==='shape'){pathObjectToPath();}
  if(sel.type!=='path'){toast('Could not convert to path');return;}
  // Seed offsetDist at 0 if missing — do NOT clobber existing keyframes
  // (the user may have already animated it and just re-opened the menu).
  if(!sel.props.offsetDist||typeof sel.props.offsetDist.base!=='number'){
    sel.props.offsetDist=B(0);
  }
  // Select the new lane row in the inspector so it scrolls into view.
  touch();commit('dynoffset',true);buildInspector();dirty=true;
  toast('Dynamic Offset added — animate OFFSET in the inspector / timeline');}

// ---- Simplify (reduce nodes within a tolerance) ----
function pathSimplify(tolerance){
  if(!sel||sel.type!=='path'){toast('Select a path layer');return;}
  const L=sel;
  const anchors=penFromD(L.d);
  const before=anchors.length;
  if(before<4){toast('Not enough nodes to simplify');return;}
  // Convert anchors to {x,y} points for RDP
  const pts=anchors.map(a=>({x:a.p[0],y:a.p[1]}));
  const simplified=rdp(pts,tolerance||2);
  // Rebuild anchors
  const newAnchors=simplified.map(p=>({p:[p.x,p.y],in:null,out:null,closeAfter:false}));
  // Preserve closeAfter from the original last anchor
  if(anchors.length>0&&anchors[anchors.length-1].closeAfter)
    newAnchors[newAnchors.length-1].closeAfter=true;
  pen.anchors=newAnchors;pen.closed=!!L.closed;
  L.d=penToD();
  touch();commit('simplify',true);buildInspector();dirty=true;
  toast('Simplify — '+before+' → '+newAnchors.length+' nodes (tolerance '+tolerance+'px)');}

// ---- Reverse (flip path direction) ----
function pathReverse(){
  if(!sel||sel.type!=='path'){toast('Select a path layer');return;}
  const L=sel;
  const anchors=penFromD(L.d);
  if(anchors.length<2){toast('Not enough nodes');return;}
  // Reverse anchor order and swap in/out handles
  const reversed=anchors.slice().reverse().map(a=>({
    p:a.p,in:a.out,out:a.in,closeAfter:false
  }));
  // Preserve closeAfter on the (new) last anchor
  if(anchors[0].closeAfter)reversed[reversed.length-1].closeAfter=true;
  pen.anchors=reversed;pen.closed=!!L.closed;
  L.d=penToD();
  touch();commit('reverse',true);buildInspector();dirty=true;
  toast('Path reversed — '+anchors.length+' nodes');}

// ---- Trace Bitmap (image layer → vector paths) ----
// Modes: 'threshold' (binary), 'quantize' (color-quantize), 'edge' (edge-trace)
// Parameters:
//   threshold (0-255)        — luminance threshold for threshold/edge modes
//   levels    (2-16)         — palette size for quantize mode
//   speckle   (min area px)  — components smaller than this many pixels are dropped
//   smoothing (RDP tol px)   — perpendicular-distance tolerance for RDP simplification
//   cornerThr (0-180 deg)    — interior angle below which a point is force-kept as a
//                              sharp corner, independent of smoothing. 0 = pure RDP,
//                              180 = keep every boundary pixel.
function pathTraceBitmap(mode,threshold,levels,speckle,smoothing,cornerThr){
  if(!sel||sel.type!=='image'){toast('Select an image layer');return;}
  const L=sel;
  const W=project.w,H=project.h,t=time;
  const Pbg=Object.assign({},project,{bg:'rgba(0,0,0,0)'});
  // Render the image layer to canvas
  const c=document.createElement('canvas');c.width=W;c.height=H;
  renderProject(c.getContext('2d'),Pbg,t,{filter:x=>x.id===L.id});
  const imgData=c.getContext('2d').getImageData(0,0,W,H);
  const data=imgData.data;
  const results=[]; // array of {d, fill, rawCount, simplifiedCount}
  const CX=W/2,CY=H/2;
  const cx=sample(L,'x',t),cy=sample(L,'y',t);
  const smEps=Math.max(0.1,smoothing||2);
  const cThr=cornerThr||0;
  // helper that runs the trace→simplify pipeline for one binary mask
  function traceMask(mask,label,fill){
    const ring=traceOutlineFiltered(mask,W,H,speckle||10);
    if(!ring||ring.length<12)return;
    const poly=rdpCorners(ring,smEps,cThr);
    if(poly.length<3)return;
    const d=[{type:'M',pts:[[poly[0].x-CX-cx,CY-poly[0].y-cy]]}];
    for(let i=1;i<poly.length;i++)d.push({type:'L',pts:[[poly[i].x-CX-cx,CY-poly[i].y-cy]]});
    d.push({type:'Z',pts:[]});
    results.push({d:d,fill:fill,name:label,rawCount:ring.length,simplifiedCount:poly.length});
  }
  if(mode==='threshold'||!mode){
    // Binary threshold: pixels with luminance >= threshold (and alpha>128) → mask
    const m=new Uint8Array(W*H);
    for(let i=0;i<W*H;i++){
      const r=data[i*4],g=data[i*4+1],b=data[i*4+2],a=data[i*4+3];
      const lum=(r*0.299+g*0.587+b*0.114);
      if(a>128&&lum>=(threshold||128))m[i]=1;
    }
    traceMask(m,'Trace 1','#F2EFE7');
  }else if(mode==='quantize'){
    // Color quantize: reduce to N levels, trace each band as a separate path
    const n=levels||4;
    const palette=[];
    for(let i=0;i<n;i++)palette.push(Math.floor(i*255/(n-1)));
    for(let pi=0;pi<palette.length;pi++){
      const pal=palette[pi];
      const m=new Uint8Array(W*H);
      for(let i=0;i<W*H;i++){
        const lum=Math.round((data[i*4]*0.299+data[i*4+1]*0.587+data[i*4+2]*0.114)/255*(n-1))/(n-1)*255;
        if(Math.abs(lum-pal)<255/n/2&&data[i*4+3]>128)m[i]=1;
      }
      const gray=Math.round(pal).toString(16).padStart(2,'0');
      traceMask(m,'Trace '+(pi+1),'#'+gray+gray+gray);
    }
  }else if(mode==='edge'){
    // Edge trace: Sobel edge detection, trace the edges
    const edges=new Uint8Array(W*H);
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      const i=y*W+x;
      if(data[i*4+3]<128)continue;
      const gx=-data[(i-W-1)*4]+data[(i-W+1)*4]-2*data[(i-1)*4]+2*data[(i+1)*4]-data[(i+W-1)*4]+data[(i+W+1)*4];
      const gy=-data[(i-W-1)*4]-2*data[(i-W)*4]-data[(i-W+1)*4]+data[(i+W-1)*4]+2*data[(i+W)*4]+data[(i+W+1)*4];
      const mag=Math.hypot(gx,gy);
      if(mag>(threshold||128))edges[i]=1;
    }
    traceMask(edges,'Trace 1','#1c2733');
  }
  if(results.length===0){toast('Trace produced no paths — try different settings');return;}
  // Create path layers
  const at=Math.max(0,project.layers.indexOf(L));
  results.forEach((r,i)=>{
    const nl=mkPath({d:r.d,closed:true,name:r.name,fill:r.fill,strokeW:0});
    nl.props.x=L.props.x;nl.props.y=L.props.y;
    project.layers.splice(Math.min(at+i,project.layers.length),0,nl);});
  // Select the first new path so undo/redo has a stable anchor and the
  // inspector immediately reflects the new layer.
  select(project.layers[Math.min(at,project.layers.length-1)]);
  buildLayers();buildTimelineRows();touch();commit('trace',true);
  dirty=true;
  const rawTotal=results.reduce((s,r)=>s+r.rawCount,0);
  const simpTotal=results.reduce((s,r)=>s+r.simplifiedCount,0);
  const reduction=rawTotal>0?Math.round((1-simpTotal/rawTotal)*100):0;
  // Node counts BEFORE (raw boundary pixels) and AFTER (post-simplification)
  // are surfaced both in the toast and in the inspector by attaching them
  // as transient _traceStats on the layer; the inspector reads them when
  // rendering the path panel.
  if(sel)sel._traceStats={mode:mode,paths:results.length,rawNodes:rawTotal,simplifiedNodes:simpTotal,reduction:reduction};
  toast('Trace Bitmap ('+mode+') — '+results.length+' paths, '+rawTotal+' → '+simpTotal+' nodes (-'+reduction+'%)');}

// Helper: trace outline with speckle filter (min area)
function traceOutlineFiltered(mask,W,H,minArea){
  // Find boundary pixels
  const bpts=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;if(!mask[i])continue;
    if(x===0||x===W-1||y===0||y===H-1||!mask[i-1]||!mask[i+1]||!mask[i-W]||!mask[i+W])
      bpts.push({x,y});}
  if(bpts.length<3)return null;
  // Cluster into 8-connected rings, filter by area
  const idxOf=new Map();
  bpts.forEach((p,i)=>idxOf.set(p.y*W+p.x,i));
  const comp=new Int32Array(bpts.length).fill(-1),comps=[];
  for(let s=0;s<bpts.length;s++){
    if(comp[s]>=0)continue;
    comp[s]=comps.length;const q=[s];comps.push([]);
    while(q.length){
      const ci=q.shift();comps[comps.length-1].push(ci);
      const p=bpts[ci];
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=p.x+dx,ny=p.y+dy;
        if(nx<0||nx>=W||ny<0||ny>=H)continue;
        const ni=idxOf.get(ny*W+nx);
        if(ni>=0&&comp[ni]<0){comp[ni]=comps.length-1;q.push(ni);}}}}
  // Find the largest component (or first that exceeds minArea)
  let best=null;
  for(const c of comps){if(c.length>=minArea&&(!best||c.length>best.length))best=c;}
  if(!best)return null;
  // Order by greedy nearest-neighbour
  const ordered=[];
  const used=new Set();
  let cur=best[0];
  ordered.push(bpts[cur]);used.add(cur);
  while(ordered.length<best.length){
    let next=-1,bd=1e9;
    for(const ci of best){
      if(used.has(ci))continue;
      const d=Math.hypot(bpts[ci].x-bpts[cur].x,bpts[ci].y-bpts[cur].y);
      if(d<bd){bd=d;next=ci;}}
    if(next<0)break;
    ordered.push(bpts[next]);used.add(next);cur=next;}
  return ordered.length>=12?ordered:null;}

// ---- PATH MENU UI ----
// A modal dialog listing all path operations, with sliders where needed.
function openPathMenu(){
  const isPath=sel&&sel.type==='path';
  const isShape=sel&&sel.type==='shape';
  const isImage=sel&&sel.type==='image';

function svgStyleAttr(str){const o={};
  String(str||'').split(';').forEach(d=>{const i=d.indexOf(':');if(i<1)return;
    const k=d.slice(0,i).trim().toLowerCase(),v=d.slice(i+1).trim();
    if(k&&v)o[k]=v;});
  return o;}
// CSS hex / rgb() / rgba() / named colors → 6-digit hex ('none' passes through)
function svgColor(v,fb){
  if(v==null)return fb;
  v=String(v).trim().toLowerCase();
  if(!v)return fb;
  if(v==='none'||v==='transparent')return 'none';
  if(v==='currentcolor')return '#000000';
  if(v[0]==='#'){let h=v.slice(1);
    if(h.length===3||h.length===4)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];

svgWrap.addEventListener('dragenter',e=>{

        const move=mev=>{

          const newT=clamp(startVal+dx,0,project.dur);
          if(which==='in'){L.inPoint=clamp(newT,0,L.outPoint);}

function startKeyDrag(e,L,k,kk,el){

    if(Math.abs(nt-kk.t)>1e-9){moved=true;kk.t=nt;el.style.left=(nt*pps)+'px';

 $('#tlScroll').addEventListener('pointerdown',e=>{

  const r=$('#ruler').getBoundingClientRect();

  if(e.shiftKey){

    const box=document.createElement('div');
    box.style.cssText='position:fixed;border:1px dashed var(--acc);background:rgba(255,77,38,.1);pointer-events:none;z-index:80';
    box.style.left=startX+'px';box.style.top=e.clientY+'px';box.style.width='0px';box.style.height='0px';
    document.body.appendChild(box);
    const mv=ev=>{

      box.style.left=x1+'px';box.style.width=(x2-x1)+'px';
      box.style.top=Math.min(e.clientY,ev.clientY)+'px';
      box.style.height=Math.abs(ev.clientY-e.clientY)+'px';};
    const up=ev=>{
      removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
      box.remove();
      const x1=Math.min(startX,ev.clientX),x2=Math.max(startX,ev.clientX);
      const t1=clamp((x1-r.left)/r.width*project.dur,0,project.dur);
      const t2=clamp((x2-r.left)/r.width*project.dur,0,project.dur);
      selKeys.clear();
      for(const L of project.layers){
        const allKeys=L.type==='path'?[...PROP_KEYS,...PATH_PROP_KEYS]:PROP_KEYS;
        for(const k of allKeys){
          const p=L.props[k];

    addEventListener('pointermove',mv);addEventListener('pointerup',up);

  scrub(e);

  addEventListener('pointermove',scrub);addEventListener('pointerup',up);});

function resizeProject(w,h,scaleLayersToFit){

    // layers' centre stays put in proportional terms. Translate x/y to
    // keep the centre anchored: new_x = (old_x - oldW/2)*sx + newW/2.

        if(py.keys&&py.keys.length){

        }else py.base=(py.base-oldH/2)*sy+h/2;

      if(L.props.scale){

        }else L.props.scale.base*=s;

// ---------- contour / offset path tool ----------
// Generates one or more new path layers that run parallel to a selected path
// or shape layer at a set distance. The polygon is offset along each edge's
// outward normal; corners are joined by miter / round / bevel per the setting.
// COPIES repeats the offset at N×distance; SIDE=Both runs it in both directions.
// Settings live in a CONTOUR section of the inspector (path & shape layers only).
const contourState={
  side:'Outside',      // 'Outside' | 'Inside' | 'Both'
  distance:20,          // px
  corners:'Round',     // 'Miter' | 'Round' | 'Bevel'
  copies:1,             // 1–8
  strokeEdge:false};   // MEASURE FROM: false=Center, true=Stroke Edge
// corner-style icons — small inline SVGs so the button group reads at a glance
const CORNER_ICONS={
  Miter:'<svg viewBox="0 0 16 16" width="13" height="13"><path d="M2 14 L8 3 L14 14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="miter"/></svg>',
  Round:'<svg viewBox="0 0 16 16" width="13" height="13"><path d="M2 14 L5 14 Q8 14 8 11 L8 5 Q8 2 11 2 L14 2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  Bevel:'<svg viewBox="0 0 16 16" width="13" height="13"><path d="M2 14 L6 14 L14 6 L14 14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="bevel"/></svg>'};
// line–line intersection (extended edges). Returns null for parallel lines.
function lineLineIntersect(p1,p2,p3,p4){
  const x1=p1.x,y1=p1.y,x2=p2.x,y2=p2.y,x3=p3.x,y3=p3.y,x4=p4.x,y4=p4.y;
  const denom=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(denom)<1e-9)return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/denom;
  return{x:x1+t*(x2-x1),y:y1+t*(y2-y1)};}
// flatten a single closed subpath's d-segments into a polygon (array of {x,y}).
// Returns null for open paths, multi-subpath paths, or anything we can't offset.
// Cubic segments are flattened to 8 line steps — same density as the variable-
// width renderer uses, dense enough for clean miter/round joins on any stroke.
function flattenPathToPolygon(d,closed){
  if(!Array.isArray(d)||!d.length)return null;
  let pts=[],started=false,subpaths=0,last=null;
  for(const s of d){
    if(!s||!Array.isArray(s.pts))continue;
    if(s.type==='M'&&s.pts[0]){
      if(started)subpaths++;             // a second M = second subpath — bail out
      pts.push({x:+s.pts[0][0],y:+s.pts[0][1]});last=pts[pts.length-1];started=true;}
    else if(s.type==='L'&&s.pts[0]){
      pts.push({x:+s.pts[0][0],y:+s.pts[0][1]});last=pts[pts.length-1];}
    else if(s.type==='C'&&s.pts[2]&&last){
      const c1={x:+s.pts[0][0],y:+s.pts[0][1]},c2={x:+s.pts[1][0],y:+s.pts[1][1]},
            e={x:+s.pts[2][0],y:+s.pts[2][1]},steps=8;
      for(let i=1;i<=steps;i++){const t=i/steps,u=1-t;
        pts.push({x:u*u*u*last.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*e.x,
                  y:u*u*u*last.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*e.y});}
      last=e;}
    else if(s.type==='Z'){/* closure marker — handled by `closed` flag */}}
  if(subpaths>0||!closed||pts.length<3)return null;
  // drop a duplicate closing point if the source path has one
  if(pts.length>1){
    const f=pts[0],l=pts[pts.length-1];
    if(Math.hypot(f.x-l.x,f.y-l.y)<0.5)pts.pop();}
  return pts;}
// extract a closed polygon from any path or shape layer (layer-local coords,
// y-up, origin at the layer's own pivot — same space L.d lives in).
function contourPolygon(L){
  if(L.type==='shape'){
    const op=outlinePts(L);
    if(!op||op.length<3)return null;
    return op.map(p=>({x:p[0],y:p[1]}));}
  if(L.type==='path')return flattenPathToPolygon(L.d,L.closed);
  return null;}
// offset a closed polygon by `distance` px (positive = outward, negative = inward).
// corners: 'Miter' | 'Round' | 'Bevel'. Miter clamps to 4×|distance| before
// falling back to bevel, matching the CSS stroke-miterlimit convention.
// Returns the offset polygon as {x,y}[] (open — caller closes with Z), or null.
function offsetPolygon(pts,distance,corners){
  const n=pts.length;
  if(n<3||Math.abs(distance)<0.01)return null;
  // winding: signed area > 0 = CCW (y-up math). outward normal = sign*(dy,-dx)/len
  let area=0;
  for(let i=0;i<n;i++){const j=(i+1)%n;area+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}
  const isCCW=area>0,sign=isCCW?1:-1;
  // offset edges: each is the parallel line at `distance` along the outward normal
  const oe=[];
  for(let i=0;i<n;i++){
    const j=(i+1)%n,dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y,len=Math.hypot(dx,dy);
    if(len<1e-9){oe.push({a:{x:pts[i].x,y:pts[i].y},b:{x:pts[j].x,y:pts[j].y}});continue;}
    const nx=sign*dy/len,ny=-sign*dx/len,d=distance;
    oe.push({a:{x:pts[i].x+nx*d,y:pts[i].y+ny*d},
             b:{x:pts[j].x+nx*d,y:pts[j].y+ny*d}});}
  // join corners — vertex i sits between edge[i-1] (ends at i) and edge[i] (starts at i)
  const out=[];
  const limit=4*Math.abs(distance);
  for(let i=0;i<n;i++){
    const prev=oe[(i-1+n)%n],cur=oe[i];
    if(corners==='Miter'){
      const inter=lineLineIntersect(prev.a,prev.b,cur.a,cur.b);
      if(inter){
        // miter length = distance from the offset vertex (≈ prev.b) to the intersection
        const ml=Math.hypot(inter.x-prev.b.x,inter.y-prev.b.y);
        if(ml<=limit){out.push(inter);}
        else{out.push(prev.b);out.push(cur.a);}      // clamped → bevel fallback
      }else{out.push(prev.b);}}                       // parallel edges — single point
    else if(corners==='Round'){
      // arc from prev.b to cur.a centred at the original vertex pts[i], radius=|distance|
      out.push(prev.b);
      const c=pts[i],r=Math.abs(distance);
      const a0=Math.atan2(prev.b.y-c.y,prev.b.x-c.x);
      const a1=Math.atan2(cur.a.y-c.y,cur.a.x-c.x);
      // arc direction = polygon traversal direction (CCW poly → positive angular delta)
      let delta=a1-a0;
      while(delta>Math.PI)delta-=2*Math.PI;
      while(delta<=-Math.PI)delta+=2*Math.PI;
      if(isCCW&&delta<0)delta+=2*Math.PI;
      if(!isCCW&&delta>0)delta-=2*Math.PI;
      const steps=Math.max(2,Math.ceil(Math.abs(delta)/(Math.PI/8)));
      for(let s=1;s<steps;s++){const t=s/steps,a=a0+delta*t;
        out.push({x:c.x+r*Math.cos(a),y:c.y+r*Math.sin(a)});}
      out.push(cur.a);}
    else{out.push(prev.b);out.push(cur.a);}}          // Bevel: straight connector
  return out.length?out:null;}
// build the d-segment list for a closed offset polygon (M + L* + Z)
function polygonToD(pts){
  if(!pts||pts.length<3)return null;
  const d=[{type:'M',pts:[[pts[0].x,pts[0].y]]}];
  for(let i=1;i<pts.length;i++)d.push({type:'L',pts:[[pts[i].x,pts[i].y]]});
  d.push({type:'Z',pts:[]});
  return d;}
// the apply action — reads contourState + the selected layer, builds the offset
// polygons and inserts one mkPath per copy directly below the source layer
function applyContour(){
  if(!sel||(sel.type!=='path'&&sel.type!=='shape')){
    toast('Select a path or shape layer first');return;}
  const src=contourPolygon(sel);
  if(!src||src.length<3){toast('Contour needs a single closed polygon — open or multi-subpath paths are not supported');return;}
  // effective distance: MEASURE FROM STROKE EDGE subtracts half the stroke width
  // so the first contour starts at the visible stroke edge, not the path centre
  let dist=contourState.distance;
  if(contourState.strokeEdge)dist-=(sel.strokeW||0)/2;
  if(dist<0.5){toast('Distance too small after stroke-edge subtraction — increase DISTANCE or use MEASURE FROM CENTER');return;}
  // offset directions: Outside = +1, Inside = -1, Both = [-1, +1] (inside first
  // so the outside copies end up closer to the source in z-order, stacked neatly)
  const sides=contourState.side==='Both'?[-1,1]:[contourState.side==='Outside'?1:-1];
  const newLayers=[];let num=0;
  for(const side of sides){
    for(let copy=1;copy<=contourState.copies;copy++){
      num++;
      const off=offsetPolygon(src,side*dist*copy,contourState.corners);
      const d=polygonToD(off);
      if(!d){num--;continue;}                   // collapsed polygon — skip silently
      // fill = source stroke colour (or a sensible default); no stroke on contours
      const fillCol=(typeof sel.strokeColor==='string'&&sel.strokeColor[0]==='#')
        ?sel.strokeColor:(typeof sel.fill==='string'&&sel.fill[0]==='#'?sel.fill:'#FF4D26');
      const L=mkPath({name:'Contour '+num,d:d,fill:fillCol,strokeW:0,strokeColor:'#000000',
        closed:true,brushType:'round'});
      // inherit the source's transform so the contour sits exactly on top of it
      ['x','y','z','rx','ry','rz','scale'].forEach(k=>{
        L.props[k]={base:sel.props[k].base,keys:null};});
      // inherit opacity too — keeps contour visibility in sync with the source
      L.props.opacity={base:sel.props.opacity.base,keys:null};
      if(sel.parent)L.parent=sel.parent;          // share the parent chain if any
      newLayers.push(L);}}
  if(!newLayers.length){toast('No contours generated — try a smaller DISTANCE');return;}
  // insert directly below the source layer (higher index = drawn earlier = below)
  const at=project.layers.indexOf(sel);
  for(let i=0;i<newLayers.length;i++)project.layers.splice(Math.min(at+1+i,project.layers.length),0,newLayers[i]);
  // select the first contour so the user sees immediate feedback
  select(newLayers[0]);
  buildLayers();buildTimelineRows();touch();commit('contour',true);dirty=true;
  toast(newLayers.length+' contour layer'+(newLayers.length>1?'s':'')+' created');}

// ---------- scroll rig (camera parallax driver) ----------
// A single SCROLL control drives the camera's position. Dragging the scrubber
// sets cam.x (horizontal axis) and/or cam.y (vertical axis). When AUTO
// KEYFRAME is on, each scrub writes a keyframe at the current timeline time so
// the camera's path is recorded as you scrub. The companion parallax strip
// below the stage shows miniature dots per non-camera layer, positioned by
// their X offset and sized/coloured by Z depth — drag a dot to change that
// layer's Z. DEPTH PRESETS distribute layers across Z values for common
// multi-plane setups. ANIMATE SCROLL is a shortcut that drops two keyframes
// (start at t=0, end at t=dur, easeInOut) for a simple pan.
const scrollState={
  axis:'Horizontal',     // 'Horizontal' | 'Vertical' | 'Both'
  range:800,             // total scroll travel in px
  autoKey:true,         // insert keyframes on scrub
  scrubbing:false,
  scrubVal:0};           // current scrubber position 0..range
// read the active camera (the first visible camera layer)
function activeCamera(){return project.layers.find(l=>l.type==='camera'&&l.visible)||null;}
// apply a scroll value (0..range) to the camera's x and/or y, optionally
// keyframing at the current time. The value is centred on the camera's own
// origin so 0 = no offset, range = full travel.
function applyScrollVal(v,key){
  const cam=activeCamera();if(!cam)return;
  v=clamp(v,0,scrollState.range);
  const half=scrollState.range/2;
  const offset=v-half;                       // -range/2 .. +range/2
  // when keying, route through setVal so the existing keyframe-or-base logic
  // applies; otherwise just set the base so the prop doesn't gain a stray key
  if(scrollState.axis==='Horizontal'||scrollState.axis==='Both'){
    if(scrollState.autoKey){
      const base=cam.props.x.base;
      // ensure x has at least one key so setVal writes a key (not just base)
      if(!cam.props.x.keys||!cam.props.x.keys.length){cam.props.x.keys=[{t:0,v:base,e:'easeOut'}];}
      setVal(cam,'x',base+offset);}
    else cam.props.x.base=offset;}
  if(scrollState.axis==='Vertical'||scrollState.axis==='Both'){
    if(scrollState.autoKey){
      const base=cam.props.y.base;
      if(!cam.props.y.keys||!cam.props.y.keys.length){cam.props.y.keys=[{t:0,v:base,e:'easeOut'}];}
      setVal(cam,'y',base+offset);}
    else cam.props.y.base=offset;}

  updateParallaxStrip();}
// SET SCROLL START — records the camera's current x/y at t=0 (so the user can
// position the camera on stage, then bake that pose as the scroll's origin)
function setScrollStart(){
  const cam=activeCamera();if(!cam){toast('No active camera');return;}
  const x=sample(cam,'x',0),y=sample(cam,'y',0);
  upsertKey(cam.props.x,0,x);                  // forces a key at t=0 if none exists
  upsertKey(cam.props.y,0,y);
  touch();dirty=true;commit('scrollStart');
  toast('Scroll start set at t=0 (X='+x.toFixed(0)+', Y='+y.toFixed(0)+')');}
// SET SCROLL END — records the camera's x/y at t=dur. The user drags the
// scrubber to the far position first, then bakes it.
function setScrollEnd(){
  const cam=activeCamera();if(!cam){toast('No active camera');return;}
  const x=sample(cam,'x',project.dur),y=sample(cam,'y',project.dur);
  upsertKey(cam.props.x,project.dur,x);
  upsertKey(cam.props.y,project.dur,y);
  touch();dirty=true;commit('scrollEnd');
  toast('Scroll end set at t='+project.dur.toFixed(2)+'s (X='+x.toFixed(0)+', Y='+y.toFixed(0)+')');}
// ANIMATE SCROLL — drops two keyframes (start at t=0, end at t=dur, easeInOut)
// for a simple linear pan. The user enters start/end scroll values; the rig
// converts them to camera x/y offsets centred on the camera's origin.
function animateScroll(startVal,endVal){
  const cam=activeCamera();if(!cam){toast('No active camera');return;}
  const half=scrollState.range/2;
  const s=clamp(startVal,0,scrollState.range)-half;
  const e=clamp(endVal,0,scrollState.range)-half;
  const ox=cam.props.x.base,oy=cam.props.y.base;
  // build the key arrays fresh — a single clean easeInOut pan
  if(scrollState.axis!=='Vertical'){
    cam.props.x.keys=[
      {t:0,v:ox+s,e:'easeInOut'},
      {t:project.dur,v:ox+e,e:'easeInOut'}];}
  if(scrollState.axis!=='Horizontal'){
    cam.props.y.keys=[
      {t:0,v:oy+s,e:'easeInOut'},
      {t:project.dur,v:oy+e,e:'easeInOut'}];}
  touch();dirty=true;buildTimelineRows();commit('animateScroll');
  toast('Scroll animated: '+(startVal|0)+' → '+(endVal|0)+'px over '+project.dur.toFixed(1)+'s');}
// ASSIGN DEPTHS modal — opens a small modal listing all non-camera layers with
// a Z slider each (−400 to +800). Preset buttons distribute layers evenly
// across the listed Z values, in current z-order (top of list = fg, bottom = sky).
const DEPTH_PRESETS={
  '3-LAYER':[600,200,-100],                  // sky, mid, fg
  '5-LAYER':[800,500,200,50,-150],           // sky, far, mid, near, fg
  'FLAT':[0]};                               // all zero — disables parallax
function openDepthModal(){
  const layers=project.layers.filter(l=>l.type!=='camera');
  if(!layers.length){toast('No layers to assign depths to');return;}
  // top of list (project.layers[0]) = fg → reverse so preset[0]=sky maps to the
  // bottom layer (last in project.layers). preset values are [sky, ..., fg].
  const ordered=layers.slice().reverse();     // ordered[0] = bottom = sky
  function applyPreset(name){
    const zs=DEPTH_PRESETS[name];if(!zs)return;
    ordered.forEach((L,i)=>{
      const z=zs.length===1?zs[0]:zs[Math.min(i,zs.length-1)*(zs.length-1)/Math.max(1,ordered.length-1)|0];
      L.props.z.base=clamp(z,-400,800);
      L.props.z.keys=null;});                // depth presets use base only — no keys
    touch();dirty=true;commit('depthPreset');
    refreshZVals();updateParallaxStrip();
    toast('Depth preset "'+name+'" applied to '+ordered.length+' layer'+(ordered.length>1?'s':''));}
  function refreshZVals(){
    document.querySelectorAll('.dmodal-row').forEach((row,i)=>{
      const L=ordered[i];if(!L)return;
      const z=sample(L,'z',0);
      const zv=row.querySelector('.zv');if(zv)zv.textContent=z.toFixed(0);

  openModal('<div class="mhead"><h2>ASSIGN DEPTHS</h2><button class="ibtn mclose">'+ic('x',16)+'</button></div>'
    +'<div class="sech2">PRESETS</div>'
    +'<div class="dmodal-presets">'
    +Object.keys(DEPTH_PRESETS).map(n=>'<button data-preset="'+n+'">'+n+'</button>').join('')
    +'</div>'
    +'<div class="sech2">LAYERS · drag to set Z (top = sky, bottom = fg)</div>'
    +'<div class="dmodal-body">'
    +ordered.map((L,i)=>{
      const z=sample(L,'z',0);
      return '<div class="dmodal-row" data-id="'+L.id+'">'
        +'<div class="nm">'+ic(iconFor(L),12)+esc(L.name)+'</div>'
        +'<input type="range" min="-400" max="800" step="10" value="'+z+'">'
        +'<div class="zv">'+z.toFixed(0)+'</div>'
        +'</div>';}).join('')
    +'</div>');
  document.querySelectorAll('.dmodal-presets button').forEach(b=>{
    b.addEventListener('click',()=>applyPreset(b.dataset.preset));});
  document.querySelectorAll('.dmodal-row').forEach((row,i)=>{
    const L=ordered[i];if(!L)return;
    const sld=row.querySelector('input[type=range]');
    const zv=row.querySelector('.zv');
    sld.addEventListener('input',()=>{
      const z=clamp(parseFloat(sld.value),-400,800);
      L.props.z.base=z;L.props.z.keys=null;
      zv.textContent=z.toFixed(0);
      touch();dirty=true;updateParallaxStrip();});
    sld.addEventListener('change',()=>commit('depthSlider'));});

// PARALLAX PREVIEW STRIP — miniature dots per non-camera layer, positioned by
// their X offset (centred on the strip) and sized/coloured by Z depth. Closer
// layers (negative Z) get bigger white dots; farther layers (positive Z) get
// smaller grey dots. Dragging a dot changes that layer's Z.
function updateParallaxStrip(){
  const strip=document.querySelector('#parallaxStrip');
  if(!strip)return;
  const cam=activeCamera();
  strip.hidden=!cam;
  if(!cam)return;
  const track=strip.querySelector('.ps-track');
  if(!track)return;
  const layers=project.layers.filter(l=>l.type!=='camera'&&l.visible);
  // build/reuse dot elements — one per layer, keyed by id
  const existing={};
  track.querySelectorAll('.ps-dot').forEach(d=>{existing[d.dataset.id]=d;});
  const seen=new Set();
  const tw=track.clientWidth||600;
  const cx=tw/2;
  const camX=sample(cam,'x',CUR_T);
  const camZ=sample(cam,'z',CUR_T);
  for(const L of layers){
    seen.add(L.id);
    let dot=existing[L.id];
    if(!dot){dot=document.createElement('div');dot.className='ps-dot';dot.dataset.id=L.id;
      track.appendChild(dot);
      // wire drag — adjusts the layer's Z base in real time
      dot.addEventListener('pointerdown',e=>{
        e.preventDefault();e.stopPropagation();
        dot.setPointerCapture(e.pointerId);
        const startY=e.clientY,startZ=sample(L,'z',CUR_T);
        const mv=ev=>{const dz=(startY-ev.clientY)*2;
          L.props.z.base=clamp(startZ+dz,-400,800);L.props.z.keys=null;
          touch();dirty=true;updateParallaxStrip();};
        const up=()=>{dot.removeEventListener('pointermove',mv);
          dot.removeEventListener('pointerup',up);};
        dot.addEventListener('pointermove',mv);dot.addEventListener('pointerup',up);});}
    // sample the layer's current world X (with parent chain) and Z
    const lx=sample(L,'x',CUR_T),lz=sample(L,'z',CUR_T);
    // parallax factor (mirror of proj()'s math) — closer layers move more
    const dz=lz-camZ;
    const depth=cam.fov/Math.max(1,cam.fov+dz);
    // screen-space offset: layer's world X minus camera X, scaled by parallax
    const dx=(lx-camX)*depth;
    // map to strip pixels — clamp so dots stay in the strip
    const px=clamp(cx+dx*0.3,-20,tw+20);
    dot.style.left=px+'px';
    // size: closer (more negative Z) = bigger; farther (positive Z) = smaller
    const sizeFactor=clamp(1-(lz+400)/1200,0.2,1);   // -400→1.0, +800→0.2
    const size=4+sizeFactor*10;                       // 4..14px
    dot.style.width=size+'px';dot.style.height=size+'px';
    // colour: white for fg, grey for sky, accent for mid
    dot.classList.toggle('fg',lz<-50);
    dot.classList.toggle('sky',lz>300);}
  // drop dots for layers no longer present
  track.querySelectorAll('.ps-dot').forEach(d=>{if(!seen.has(d.dataset.id))d.remove();});}

// ---------- repeat / copy tool (grid + radial) ----------
// Adds a REPEAT collapsible section at the bottom of the inspector (below
// EFFECTS, above KEYFRAME). Shown for all layer types. Generates independent
// deep clones of the selected layer arranged on a grid or around a circle.
// Stagger shifts every keyframe in copy N by +stagger*N seconds so the clones
// cascade in. The original layer is copy 0 — it stays put, all clones stack
// immediately above it in z-order (earlier in project.layers).
const repeatState={
  mode:'None',          // 'None' | 'Grid' | 'Radial'
  cols:3,rows:3,gapX:80,gapY:80,gridStagger:0,
  count:6,radius:160,startAngle:0,rotateCopies:true,radialStagger:0};
let repeatCollapsed=false;             // collapse state — independent of layer

// deep clone of a layer: JSON parse/stringify strips the underscore-prefixed
// runtime fields (particle sim state, _bb cache) via the strip() replacer, then
// we reassign a fresh id and clear the parent (parent chains don't survive a
// clone — the copy is its own root). The clone is then sanitize()'d on next
// load to guarantee its props/sanitize are valid.
function cloneLayer(L){
  const cp=JSON.parse(JSON.stringify(L,strip));
  cp.id=uid();
  cp.parent=null;                       // a clone starts unparented — its pose is absolute
  // ensure props exist for every transform key (legacy safety)
  PROP_KEYS.forEach(k=>{if(!cp.props||!cp.props[k])cp.props[k]=B(k==='opacity'||k==='scale'?1:0);});
  return cp;}
// shift every keyframe on every property of `L` by +dt seconds. Leaves the
// base values alone — only key times move. Negative times are clamped to 0
// (a key can't start before the comp). Re-sorts each key array by new t.
function shiftKeyframes(L,dt){
  if(!dt||dt<=0)return;
  for(const k of PROP_KEYS){
    const p=L.props[k];
    if(!p||!p.keys||!p.keys.length)continue;
    let bumped=false;
    for(const kk of p.keys){
      const nt=Math.max(0,Math.round((kk.t+dt)*1000)/1000);
      if(nt!==kk.t){kk.t=nt;bumped=true;}}
    if(bumped)p.keys.sort((a,b)=>a.t-b.t);}}
// ensure a keyframe exists on property `k` of `L` at time t — returns the key.
// If one already exists at t (within 1ms) it's reused; otherwise a new key is
// pushed with the layer's current sampled value at t and the existing easing
// preset (easeOut for the first key, easeInOut for the rest).
function ensureKeyAt(L,k,t){
  const p=L.props[k];
  t=Math.round(t*1000)/1000;
  if(!p.keys)p.keys=[];
  let kk=p.keys.find(q=>Math.abs(q.t-t)<1e-6);
  if(kk)return kk;
  kk={t:t,v:sample(L,k,t),e:p.keys.length?'easeInOut':'easeOut'};
  p.keys.push(kk);p.keys.sort((a,b)=>a.t-b.t);
  return kk;}

// APPLY GRID — (cols×rows − 1) copies arranged on a centered grid. Position
// offsets are absolute layer-space deltas applied to the copy's x/y base (and
// to any x/y keyframes so a keyed source still cascades correctly). Stagger
// shifts every keyframe in copy N by +stagger*N seconds. The original occupies
// the grid's center cell (or the cell just below-left of center for even dims)
// — that slot is skipped so the original stays in place as copy 0.
function applyGrid(){
  if(!sel){toast('Select a layer first');return;}
  if(sel.type==='camera'){toast('Cameras can\'t be repeated');return;}
  const {cols,rows,gapX,gapY,gridStagger}=repeatState;
  const c=clamp(Math.round(cols),2,20),r=clamp(Math.round(rows),2,20);
  const gx=clamp(gapX,-2000,2000),gy=clamp(gapY,-2000,2000);
  const stag=clamp(gridStagger,0,30);
  // center the grid on the original: origin offset = ((cols-1)/2 * gapX, …)
  const ox=(c-1)/2*gx,oy=(r-1)/2*gy;
  // the original's own slot — floor((c-1)/2), floor((r-1)/2). For odd dims this
  // is the exact middle cell; for even dims it's the cell just below-left of
  // the geometric center, which keeps the grid centered on the original's pose
  const originCol=Math.floor((c-1)/2),originRow=Math.floor((r-1)/2);
  const newLayers=[];
  let idx=0;
  for(let row=0;row<r;row++)for(let col=0;col<c;col++){
    if(col===originCol&&row===originRow)continue;       // skip the original's own slot
    idx++;
    const cp=cloneLayer(sel);
    const dx=col*gx-ox,dy=-(row*gy-oy); // engine y is up — flip the row delta
    // apply position offset to base + every x/y keyframe
    cp.props.x.base+=dx;cp.props.y.base+=dy;
    if(cp.props.x.keys)cp.props.x.keys.forEach(kk=>kk.v+=dx);
    if(cp.props.y.keys)cp.props.y.keys.forEach(kk=>kk.v+=dy);
    cp.name=sel.name+' · '+col+','+row;
    if(stag>0)shiftKeyframes(cp,stag*idx);
    newLayers.push(cp);}
  // stack above the original (earlier index = drawn later = on top)
  const at=project.layers.indexOf(sel);
  for(let i=0;i<newLayers.length;i++)
    project.layers.splice(Math.max(0,at-i),0,newLayers[i]);
  buildLayers();buildTimelineRows();touch();commit('repeatGrid',true);dirty=true;
  finishRepeat(newLayers.length);}
// APPLY RADIAL — (count − 1) copies around a circle. Copy N sits at angle
// startAngle + (360/count)*N. If rotateCopies is on, each copy's rz at t=0 is
// set to (original rz + angle) so the clones fan out facing outward. Stagger
// shifts every keyframe by +stagger*N seconds.
function applyRadial(){
  if(!sel){toast('Select a layer first');return;}
  if(sel.type==='camera'){toast('Cameras can\'t be repeated');return;}
  const {count,radius,startAngle,rotateCopies,radialStagger}=repeatState;
  const n=clamp(Math.round(count),2,36);
  const rad=clamp(radius,-2000,2000);
  const sa=clamp(startAngle,-360,360);
  const stag=clamp(radialStagger,0,30);
  const ox=sel.props.x.base,oy=sel.props.y.base;   // origin = original's base position
  const newLayers=[];
  for(let i=1;i<n;i++){
    const cp=cloneLayer(sel);
    const ang=(sa+(360/n)*i)*Math.PI/180;
    const nx=ox+rad*Math.cos(ang),ny=oy+rad*Math.sin(ang);
    // set the copy's position — base + a t=0 keyframe if any keys exist on x/y
    cp.props.x.base=nx;cp.props.y.base=ny;
    if(cp.props.x.keys)cp.props.x.keys.forEach(kk=>{if(Math.abs(kk.t)<1e-6)kk.v=nx;else kk.v+=nx-ox;});
    if(cp.props.y.keys)cp.props.y.keys.forEach(kk=>{if(Math.abs(kk.t)<1e-6)kk.v=ny;else kk.v+=ny-oy;});
    // rotate copies — ensure an rz key at t=0 exists, set its value to original rz + angle (deg)
    if(rotateCopies){
      const baseRz=sample(sel,'rz',0);          // original rotation at t=0
      const newRz=baseRz+(sa+(360/n)*i);        // additive — keep the source's own spin
      const kk=ensureKeyAt(cp,'rz',0);
      kk.v=newRz;
      cp.props.rz.base=newRz;}                  // base mirrors the key so scrubbing stays consistent
    cp.name=sel.name+' · r'+i;
    if(stag>0)shiftKeyframes(cp,stag*i);
    newLayers.push(cp);}
  const at=project.layers.indexOf(sel);
  for(let i=0;i<newLayers.length;i++)
    project.layers.splice(Math.max(0,at-i),0,newLayers[i]);

// draw the curves mini-editor on a 96×96 canvas. Shows the active channel's
// bezier curve with draggable handles — same interaction as the ease curve editor.
function drawGradeCv(cv,grade,tab){
  const W=96,H=96,dpr=devicePixelRatio||1;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const bg=cssVar('--bg0'),ln=cssVar('--line'),acc=cssVar('--acc');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  // grid
  c.strokeStyle=ln;c.lineWidth=1;
  for(let i=1;i<4;i++){c.beginPath();c.moveTo(i*W/4+.5,0);c.lineTo(i*W/4+.5,H);c.stroke();
    c.beginPath();c.moveTo(0,i*H/4+.5);c.lineTo(W,i*H/4+.5);c.stroke();}
  // diagonal reference
  c.strokeStyle='#3A4150';c.beginPath();c.moveTo(.5,H-.5);c.lineTo(W-.5,.5);c.stroke();
  // curve
  const curve=grade.curve&&grade.curve[tab]?grade.curve[tab]:[0.25,0.25,0.75,0.75];
  c.strokeStyle=acc;c.lineWidth=2;c.lineJoin='round';c.lineCap='round';
  c.beginPath();
  for(let i=0;i<60;i++){const u=i/59,y=bezierEval(curve,u),py=(1-y)*H;
    i?c.lineTo(u*W,py):c.moveTo(u*W,py);}
  c.stroke();
  // handles
  const hd=[{x:curve[0]*W,y:clamp((1-curve[1])*H,3,H-3)},
            {x:curve[2]*W,y:clamp((1-curve[3])*H,3,H-3)}];
  c.setLineDash([3,3]);c.lineWidth=1;c.strokeStyle='rgba(233,231,225,.35)';
  c.beginPath();c.moveTo(0,0);c.lineTo(hd[0].x,hd[0].y);c.stroke();
  c.beginPath();c.moveTo(W,H);c.lineTo(hd[1].x,hd[1].y);c.stroke();
  c.setLineDash([]);
  for(const q of hd){c.beginPath();c.arc(q.x,q.y,3,0,6.2832);
    c.fillStyle=acc;c.fill();c.strokeStyle=bg;c.lineWidth=1.5;c.stroke();}}
function gradeUI(el,target,isMaster,rebuild){
  const rebuildFn=rebuild||( ()=>buildInspector() );

      body.appendChild(gradeSlider('VIGNETTE',g.vignette,0,1,0.01,v=>g.vignette=v));

      const hint=div('ezhint');hint.textContent='CURVES · DRAG HANDLES';
      cvWrap.appendChild(hint);

      ['rgb','r','g','b'].forEach(tab=>{
        const t=document.createElement('button');t.className='gtab'+(gradeCurTab===tab?' on':'');
        t.textContent=tab.toUpperCase();
        t.addEventListener('click',()=>{gradeCurTab=tab;rebuildFn();});
        tabs.appendChild(t);});

        return{x:ev.clientX-r.left-cv.clientLeft,y:ev.clientY-r.top-cv.clientTop};};
      cv.addEventListener('pointerdown',ev=>{
        if(ev.button!==0)return;
        const p=pos(ev),W=96,H=96;
        const curve=g.curve&&g.curve[gradeCurTab]?g.curve[gradeCurTab]:[0.25,0.25,0.75,0.75];
        const hd=[{x:curve[0]*W,y:clamp((1-curve[1])*H,3,H-3)},{x:curve[2]*W,y:clamp((1-curve[3])*H,3,H-3)}];
        const d0=Math.hypot(p.x-hd[0].x,p.y-hd[0].y),d1=Math.hypot(p.x-hd[1].x,p.y-hd[1].y);

        try{cv.setPointerCapture(ev.pointerId);}catch(e){}
        ev.preventDefault();});
      cv.addEventListener('pointermove',ev=>{
        if(drag<0){const p=pos(ev),W=96,H=96;
          const curve=g.curve&&g.curve[gradeCurTab]?g.curve[gradeCurTab]:[0.25,0.25,0.75,0.75];
          const hd=[{x:curve[0]*W,y:clamp((1-curve[1])*H,3,H-3)},{x:curve[2]*W,y:clamp((1-curve[3])*H,3,H-3)}];
          const near=Math.hypot(p.x-hd[0].x,p.y-hd[0].y)<=10||Math.hypot(p.x-hd[1].x,p.y-hd[1].y)<=10;
          cv.style.cursor=near?'grab':'crosshair';return;}
        const p=pos(ev),W=96,H=96;
        const nx=clamp(p.x/W,0,1),ny=clamp(1-p.y/H,0,1);
        if(!g.curve)g.curve={};
        if(!g.curve[gradeCurTab])g.curve[gradeCurTab]=[0.25,0.25,0.75,0.75];
        const b=g.curve[gradeCurTab];
        if(drag===0){b[0]=nx;b[1]=ny;}else{b[2]=nx;b[3]=ny;}
        gradeLUT._cache=null;                // invalidate LUT cache
        touch();dirty=true;drawGradeCv(cv,g,gradeCurTab);});
      const up=()=>{if(drag>=0){touch();dirty=true;commit('gradeCurve');}drag=-1;};
      cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
      // reset curve button
      const resetRow=div('prow2');resetRow.appendChild(span('plabel2','RESET'));
      const rb=document.createElement('button');rb.className='btn';rb.style.height='22px';rb.style.fontSize='9px';
      rb.textContent='RESET CURVE';
      rb.addEventListener('click',()=>{
        if(g.curve)delete g.curve[gradeCurTab];
        if(g.curve&&!Object.keys(g.curve).length)g.curve=null;
        gradeLUT._cache=null;touch();dirty=true;rebuildFn();});
      resetRow.appendChild(rb);body.appendChild(resetRow);
      // presets
      const pres=div('grade-tabs');pres.style.marginTop='6px';
      Object.keys(GRADE_PRESETS).forEach(name=>{
        const b=document.createElement('button');b.className='gtab';b.textContent=name;

          commit('gradePreset');
          toast('Grade preset: '+name);});
        pres.appendChild(b);});
      body.appendChild(pres);}
    card.appendChild(body);}
  el.appendChild(card);}

    el.appendChild(rowNumS('HEIGHT',sel.h,v=>{sel.h=clamp(v,4,2000);touch();dirty=true;}));
    if(sel.shape==='rect')el.appendChild(rowNumS('CORNER',sel.radius,v=>{sel.radius=clamp(v,0,500);touch();dirty=true;}));
    if(sel.shape==='polygon'||sel.shape==='star')el.appendChild(rowNumS('SIDES',sel.sides,v=>{sel.sides=clamp(Math.round(v),3,24);touch();buildTimelineRows();dirty=true;}));
    if(sel.shape==='star')el.appendChild(rowNumS('INNER',sel.inner,v=>{sel.inner=clamp(v,0.1,0.95);touch();dirty=true;}));
    fillTypeRows().forEach(r=>el.appendChild(r));
    el.appendChild(rowNumS('STROKE',sel.strokeW,v=>{sel.strokeW=clamp(v,0,40);touch();dirty=true;}));
    el.appendChild(rowColor('STROKE C',()=>sel.strokeColor,v=>{sel.strokeColor=v;touch();dirty=true;}));
    el.appendChild(rowNumS('EXTRUDE',sel.extrude,v=>{sel.extrude=clamp(v,0,400);touch();dirty=true;}));
    el.appendChild(rowNumS('DASH',sel.dash,v=>{sel.dash=clamp(v,0,120);touch();dirty=true;}));}
  // K4 — Draw Tool controls (always shown while draw mode is on, regardless of selection)
  if(draw.on)drawToolUI(el);
  // virtual stylus controls — when the draw tool is on, or this is a brush
  // stroke layer (path with W array) so the user can pre-tune / re-tune the feel
  if(draw.on||(sel.type==='path'&&Array.isArray(sel.W)&&sel.W.length))virtualStylusUI(el);
  // brush options (stylus pad toggle + pressure curve) for brush stroke layers
  if(sel.type==='path'&&Array.isArray(sel.W)&&sel.W.length)buildBrushOptionsUI(el);
  // CONTOUR / OFFSET PATH section — path & shape layers only, sits above EFFECTS
  if(sel.type==='path'||sel.type==='shape')contourUI(el);
  // per-layer masks — MASKS section, shown for all non-camera/null layers.
  // Collapsed by default. Add mask menu (rect/ellipse/path), per-mask controls
  // (mode, feather, opacity, invert, enable, delete), keyframable position/scale.
  if(sel.type!=='camera'&&sel.type!=='null')masksUI(el,sel);
  // per-layer color grade — COLOR section, collapsed by default. Skipped for
  // null layers (they don't render). Shown for all other layer types.
  if(sel.type!=='null')gradeUI(el,sel,false);
  // EFFECTS — not for cameras (they don't render, so effects are meaningless)
  if(sel.type!=='camera'){
    el.appendChild(secEl('EFFECTS'));
    if(!sel.fx.length){
      const fh=div('hintp');fh.style.padding='0 2px 8px';
      fh.textContent='No effects yet — add a drop shadow, outer glow or gaussian blur.';
      el.appendChild(fh);}
    sel.fx.forEach((f,i)=>el.appendChild(fxCard(f,i)));
    el.appendChild(fxAddRow());}
  // REPEAT / copy tool — collapsible, shown for non-camera layer types, sits
  // below EFFECTS and above KEYFRAME so the keyframe editor stays last. Cameras
  // are excluded because cloning a camera violates the one-camera rule.
  if(sel.type!=='camera')repeatUI(el);
  if(selKey){
    el.appendChild(secEl('KEYFRAME'));
    const info=div('kinfo');
    info.innerHTML='<b>'+esc(PROP_LABEL[selKey.k])+'</b> @ '+selKey.kk.t.toFixed(2)+'s — '+esc(selKey.L.name);
    el.appendChild(info);
    el.appendChild(rowNumS('VALUE',selKey.kk.v,v=>{selKey.kk.v=clampNum(selKey.k,v);touch();dirty=true;}));
    easeCurveUI(el);
    const b=document.createElement('button');b.className='btn danger';
    b.innerHTML=ic('trash',13)+'DELETE KEY';b.onclick=delKey;
    el.appendChild(b);}}

// ---------- export ----------
function startExport(forcedMime){
  if(exporting||xJobBusy)return;
  if(!('MediaRecorder'in window)&&!stage.captureStream){toast('Video capture is not supported in this browser');return;}
  const mime=forcedMime||['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  const videoStream=stage.captureStream(project.fps);
  // audio mixing — create an AudioContext, connect each audio layer's element
  // through a gain node (volume) to a MediaStreamDestination, then add the
  // audio tracks to the video stream for the combined WebM output
  let audioCtx=null,audioDest=null;
  const audioLayers=project.layers.filter(l=>l.type==='audio'&&l.visible);
  if(audioLayers.length){
    try{
      audioCtx=new AudioContext();
      audioDest=audioCtx.createMediaStreamDestination();
      for(const L of audioLayers){
        const e=mediaFor(L);
        if(e.ok&&e.el){
          const src=audioCtx.createMediaElementSource(e.el);
          const gain=audioCtx.createGain();
          gain.gain.value=L.mute?0:L.volume;
          src.connect(gain);
          gain.connect(audioDest);
          // also connect to the real destination so the user hears it during export
          gain.connect(audioCtx.destination);}}
      // add audio tracks to the video stream
      for(const track of audioDest.stream.getAudioTracks()){
        videoStream.addTrack(track);}}
    catch(err){console.warn('Audio mixing failed:',err);}}
  recChunks=[];cancelRec=false;
  try{rec=new MediaRecorder(videoStream,{mimeType:mime,videoBitsPerSecond:14000000});}
  catch(e){rec=new MediaRecorder(videoStream);}
  rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  rec.onstop=()=>{
    if(cancelRec){toast('Render cancelled');return;}
    const isMp4=mime&&mime.includes('mp4');
    const b=new Blob(recChunks,{type:isMp4?'video/mp4':'video/webm'});
    // Zero-size blob guard: if MediaRecorder produced nothing (a known
    // issue on some Chrome builds with H.264 mp4 mimes), fall back to the
    // WebCodecs path so the user still gets an MP4.
    if(b.size===0){
      toast('MediaRecorder produced empty MP4 — trying WebCodecs fallback');
      if(isMp4&&typeof VideoEncoder!=='undefined'){
        // Defer to the WebCodecs path. Use setTimeout so the rec overlay
        // closes cleanly first.
        setTimeout(()=>startMp4Export(),60);
        return;}
      toast('MP4 export failed — empty recording and no WebCodecs fallback');
      return;}
    dl(URL.createObjectURL(b),slug(project.name)+(isMp4?'.mp4':'.webm'));
    toast((isMp4?'MP4':'WebM')+' saved — check your downloads');};
  time=0;exporting=true;playing=true;wasLoop=looping;looping=false;
  updPlayBtn();
  const pw=$('#xProgWrap');if(pw)pw.style.display='block';
  const st=$('#xState');if(st)st.textContent='RECORDING…';
  $('#recOverlay').hidden=false;
  const pend=project.layers.filter(l=>l.type==='image').map(l=>imgFor(l)).filter(e=>!e.ok);
  Promise.all(pend.map(e=>new Promise(r=>{e.img.addEventListener('load',r,{once:true});
    e.img.addEventListener('error',r,{once:true});}))).then(()=>rec.start(120));}
function finishExport(){
  if(!exporting)return;
  exporting=false;playing=false;looping=wasLoop;updPlayBtn();
  time=0;dirty=true;
  $('#recOverlay').hidden=true;
  try{rec.stop();}catch(e){}
  // pause all audio elements after export
  for(const L of project.layers){
    if(L.type==='audio'){const e=mediaFor(L);if(e.el&&!e.el.paused)e.el.pause();}
    if(L.type==='video'){const e=mediaFor(L);if(e.el&&!e.el.paused)e.el.pause();}}}
